        }
        const goldMat = new THREE.MeshStandardMaterial({
          color: 0xffd54f,
          emissive: 0x995800,
          emissiveIntensity: 0.55,
          metalness: 0.72,
          roughness: 0.25,
        });
        const topCap = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.33, 0.11, 12), goldMat);
        topCap.position.y = 0.47;
        const topFinial = new THREE.Mesh(new THREE.OctahedronGeometry(0.11, 0), goldMat);
        topFinial.position.y = 0.6;
        const botCap = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.24, 0.11, 12), goldMat);
        botCap.position.y = -0.47;
        g.add(topCap, topFinial, botCap);
        const flame = new THREE.Mesh(SHARED.octa, new THREE.MeshBasicMaterial({ color: 0xffe478 }));
        flame.scale.set(0.22, 0.34, 0.22);
        g.add(flame);
        const tasselPivot = new THREE.Group();
        tasselPivot.position.y = -0.52;
        const knot = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), goldMat);
        const tassel = new THREE.Mesh(
          new THREE.ConeGeometry(0.09, 0.56, 8),
          new THREE.MeshToonMaterial({ color: 0xd4141a }),
        );
        tassel.position.y = -0.32;
        tasselPivot.add(knot, tassel);
        g.add(tasselPivot);
        g.scale.setScalar(scale);
        g.userData = { bodyMat, flame, tasselPivot };
        return g;
      }

      function spawnFlameBlade(fromPos, toPos) {
        const grp = new THREE.Group();
        grp.position.copy(fromPos);
        const bladeMat = createCelVfxMaterial({
          darkOutline: 0x450502,
          coreColor: 0xa81608,
          midColor: 0xff4c1a,
          rimColor: 0xffe66b,
          scroll: [1.8, -2.5],
          noiseScale: [2.8, 2.5],
          blending: THREE.AdditiveBlending,
          emissiveBoost: 1.4,
        });
        const blade = new THREE.Mesh(new THREE.RingGeometry(0.55, 1.18, 18, 1, -1.05, 2.1), bladeMat);
        blade.rotation.x = Math.PI / 2;
        grp.add(blade);
        const petals = [];
        for (let i = 0; i < 4; i++) {
          const p = new THREE.Mesh(
            SHARED.quad,
            new THREE.MeshBasicMaterial({
              map: maiPetalTex,
              transparent: true,
              side: THREE.DoubleSide,
              depthWrite: false,
            }),
          );
          p.scale.setScalar(0.38);
          grp.add(p);
          petals.push({ mesh: p, offset: i * 1.55 });
        }
        scene.add(grp);
        addEffect({
          age: 0,
          durationFrames: 26,
          particleCount: 5,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS,
              t = Math.min(f / this.durationFrames, 1);
            grp.position.lerpVectors(fromPos, toPos, t);
            grp.position.y += Math.sin(t * Math.PI) * 0.55;
            blade.rotation.z += dt * 12.5;
            bladeMat.uniforms.uTime.value = this.age;
            for (const p of petals) {
              const a = this.age * 11 + p.offset;
              p.mesh.position.set(Math.cos(a) * 0.72, Math.sin(a * 1.5) * 0.22, Math.sin(a) * 0.72);
              p.mesh.rotation.set(a, a * 0.8, a);
            }
            if (f >= this.durationFrames) {
              scene.remove(grp);
              disposeObject(grp);
              return false;
            }
            return true;
          },
        });
      }

      function triggerMaiLinhLantern() {
        if (activeStorm) activeStorm.absorbElement("pyro");

        const runeMat = createRuneDecalMaterial(maiRuneTex, 0xffe066, THREE.AdditiveBlending, 1.3);
        const runeMesh = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 7.2), runeMat);
        runeMesh.rotation.x = -Math.PI / 2;
        runeMesh.position.set(0, 0.025, -2.0);
        scene.add(runeMesh);

        const zoneLight = new THREE.PointLight(0xff9830, 5.5, 9.5, 1.8);
        zoneLight.position.set(0, 1.8, -2.0);
        scene.add(zoneLight);

        const mainLantern = createDetailedLantern(1.22);
        const basePos = new THREE.Vector3(0, 2.05, -2.0);
        mainLantern.position.copy(basePos);
        scene.add(mainLantern);

        // 5 spiraling burst lanterns; shell i launches at popFrame (F108) + i * 6 frames
        const POP_FRAME = 108;
        const burstHeights = [2.85, 3.45, 3.2, 3.55, 3.0]; // 2.8–3.6 m inside camera frame; Shell #3 = 3.2 m center
        const burstLanterns = [];
        for (let i = 0; i < 5; i++) {
          const l = createDetailedLantern(0.76);
          l.visible = false;
          scene.add(l);
          burstLanterns.push({
            mesh: l,
            angleOffset: (i / 5) * Math.PI * 2,
            popFrame: POP_FRAME + i * 6,
            launched: false,
          });
        }
        let shotCount = 0;

        addEffect({
          age: 0,
          durationFrames: 210,
          particleCount: 6,
          isHero: true,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS;
            lastCastFrame = Math.floor(f);
            const t = Math.min(f / this.durationFrames, 1);

            runeMesh.rotation.z = this.age * 0.38;
            runeMat.uniforms.uTime.value = this.age;
            runeMat.uniforms.uAlpha.value = t < 0.08 ? t / 0.08 : t > 0.8 ? (1 - t) / 0.2 : 0.94;
            runeMat.uniforms.uDissolve.value = t > 0.78 ? (t - 0.78) / 0.22 : 0.0;
            zoneLight.intensity = 5.5 * (1 - Math.max(0, (t - 0.75) / 0.25));

            mainLantern.position.y = basePos.y + Math.sin(this.age * 3.8) * 0.22;
            mainLantern.rotation.y = this.age * 0.85;
            mainLantern.userData.bodyMat.uniforms.uTime.value = this.age;
            mainLantern.userData.flame.scale.setScalar(0.24 + Math.sin(this.age * 24) * 0.05);
            mainLantern.userData.tasselPivot.rotation.z = Math.sin(this.age * 4.8) * 0.28;
            if (t > 0.84) mainLantern.scale.setScalar(1.22 * Math.max(0.01, (1 - t) / 0.16));

            if (shotCount < 3 && f >= 18 + shotCount * 28) {
              shotCount++;
              spawnFlameBlade(mainLantern.position.clone(), targetPos.clone());
            }

            // Spiral 5 lanterns from F54 -> popFrame + i*6, then launch firework shells
            if (f >= 54) {
              for (let i = 0; i < 5; i++) {
                const b = burstLanterns[i];
                if (b.launched) continue;
                b.mesh.visible = true;
                const bt = Math.min((f - 54) / (b.popFrame - 54), 1);
                const angle = b.angleOffset + bt * Math.PI * 1.9;
                const radius = THREE.MathUtils.lerp(0.65, 2.75, Math.sin(bt * Math.PI * 0.5));
                const y = 0.75 + bt * 1.45;
                b.mesh.position.set(Math.cos(angle) * radius, y, -2.0 + Math.sin(angle) * radius);
                b.mesh.rotation.y = -angle;
                b.mesh.userData.bodyMat.uniforms.uTime.value = this.age;
                b.mesh.userData.tasselPivot.rotation.z = Math.sin(this.age * 7 + i) * 0.35;
                if (f >= b.popFrame) {
                  b.launched = true;
                  b.mesh.visible = false;
                  spawnFireworkShell(b.mesh.position.clone(), i, burstHeights[i]);
                }
              }
            }

            if (f >= this.durationFrames) {
              scene.remove(runeMesh, mainLantern, zoneLight);
              disposeObject(runeMesh);
              disposeObject(mainLantern);
              for (const b of burstLanterns) {
                scene.remove(b.mesh);
                disposeObject(b.mesh);
              }
              return false;
            }
            return true;
          },
        });
      }

      // =========================================================================
      // FIX A — SƯƠNG MAI "SILVER WAVE" (45° LEFT-FORWARD, CLOSED VOLUME, 96 FRAMES)
      // =========================================================================
      /*
       * FRAME TABLE — SƯƠNG MAI "SILVER WAVE" (Rev 4 — total 96 frames + 8s buff, 60 fps):
       *   Orientation      : Whole wave group rotated +45 deg (left-forward) so default camera sees side cross-section
       *                      (crest + curling lip + hollow dark barrel) clearly at F18–F36.
       *   Closed Volume    : 2D profile extruded into a closed tube (0.35 m base tapering to 0.06 m lip:
       *                      front surface + lip rim strip + back barrel surface, 48 arc segs x 49 loop rows).
       *   F0–F5   K0       : Flat ring (0,0)(0.4,0.08)(0.8,0.12)(1.2,0); teal ring 0.5->2.0m; 20 rising droplets.
       *   F6      K1       : Low hump; left->right reveal clamp((F-6)/24, 0, 1) with +0.3 m pushing front.
       *   F10–F48 FOAM     : 60 instanced lip foam blobs wobble; F48–F60 fall with gravity & fade.
       *   F18     K2       : Tall steep concave face (h=2.8m); 7 painted white flow stripes scrolling base->lip 3 m/s.
       *   F22–F36 SPRAY    : 4 white crest spray particles/frame from lip tip (3–5 m/s forward-up, 0.05–0.10m, 14F life).
       *   F28     K3 PEAK  : Curling overhanging lip (h=3.0m) + dark barrel #0A3E4D + inner lip glow #72F0F7 (0.04m)
       *                      + 2-frame crisp white rim flash on lip (F28–F29).
       *   F30     WET      : Wet ground decal appears under wave area; dries via erosion F60–F96.
       *   F36     K4 CRASH : Lip touches ground (3.4,0); 3F hit-stop; shake 0.28 (12F); refraction ring;
       *                      8 curved spray sheets (F36–F54); 160 GPU droplets (F36–F70).
       *   F40–F80 MIST     : 10 soft procedural hydro mist puffs (FIX B, 40F life) along crash line rising 0.4 m/s.
       *   F48     K5       : Collapse h<=0.9 m.
       *   F64–F96 K6/DISS  : Sliding foam sheet thins to 0.05 m & dissolves with noise erosion (0 -> 1).
       *   0–480F  BUFF     : Two thin intertwined silver-water ribbons + 32 orbiting droplets (unchanged).
       */
      const WAVE_ARC_SEGS = 48;
      const WAVE_PROF_PTS = 24;
      const WAVE_LOOP_ROWS = WAVE_PROF_PTS * 2 + 1; // 0..23 outer front, 24..47 inner barrel back (23..0), 48 closes to 0

      function sampleProfileCatmull(pts2d) {
        const vecs = pts2d.map(([d, h]) => new THREE.Vector3(d, h, 0));
        const curve = new THREE.CatmullRomCurve3(vecs, false, "centripetal", 0.5);
        const out = new Float32Array(WAVE_PROF_PTS * 2);
        for (let i = 0; i < WAVE_PROF_PTS; i++) {
          const p = curve.getPoint(i / (WAVE_PROF_PTS - 1));
          out[i * 2] = p.x;
          out[i * 2 + 1] = Math.max(0, p.y);
        }
        return out;
      }

      const WAVE_KEYFRAMES = [
        {
          f: 0,
          pts: sampleProfileCatmull([

            [0.4, 0.08],

            [1.2, 0],

        {
          f: 5,

      function smoothstepJs(e0, e1, x) {
        const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function evalWaveProfile(f, outProfile) {
        let kA = WAVE_KEYFRAMES[0],
          kB = WAVE_KEYFRAMES[WAVE_KEYFRAMES.length - 1];
        for (let i = 0; i < WAVE_KEYFRAMES.length - 1; i++) {
          if (f >= WAVE_KEYFRAMES[i].f && f <= WAVE_KEYFRAMES[i + 1].f) {
            kA = WAVE_KEYFRAMES[i];
            kB = WAVE_KEYFRAMES[i + 1];
            break;
          }
        }
        if (f >= 64) {
          const thinT = THREE.MathUtils.clamp((f - 64) / 32, 0, 1);
          const hMul = THREE.MathUtils.lerp(1.0, 0.167, thinT);
          const src = WAVE_KEYFRAMES[WAVE_KEYFRAMES.length - 1].pts;
          for (let i = 0; i < WAVE_PROF_PTS; i++) {
            outProfile[i * 2] = src[i * 2] + thinT * 0.45;
            outProfile[i * 2 + 1] = src[i * 2 + 1] * hMul;
          }
          return;
        }
        const span = Math.max(0.0001, kB.f - kA.f);
        const rawT = THREE.MathUtils.clamp((f - kA.f) / span, 0, 1);
        const easeT = rawT * rawT * (3 - 2 * rawT);
        for (let i = 0; i < WAVE_PROF_PTS * 2; i++) {
          outProfile[i] = kA.pts[i] + (kB.pts[i] - kA.pts[i]) * easeT;
        }
      }

      function createSilverWaveShader() {
        return new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: {
            uTime: { value: 0 },
            uVisibleArc: { value: 1.0 },
            uDissolve: { value: 0.0 },
            uLipFlash: { value: 0.0 },
          },
          vertexShader: `
          attribute float aInner;
          varying vec2 vUv;
          varying float vInner;
          void main() {
            vUv = uv;
            vInner = aInner;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
          fragmentShader: `
          uniform float uTime;
          uniform float uVisibleArc;
          uniform float uDissolve;
          uniform float uLipFlash;
          varying vec2 vUv;
          varying float vInner;
          ${GLSL_NOISE}
          void main() {
            if (vUv.x > uVisibleArc) discard;

            float nDiss = fbm(vUv * vec2(8.0, 4.0) + vec2(-uTime * 0.5, -uTime * 0.8));
            if (uDissolve > 0.001 && nDiss < uDissolve) discard;

            vec3 cBase = vec3(0.047, 0.349, 0.431); // #0C596E
            vec3 cMid  = vec3(0.149, 0.725, 0.788); // #26B9C9
            vec3 cTop  = vec3(0.447, 0.941, 0.969); // #72F0F7
            vec3 cBack = vec3(0.039, 0.243, 0.302); // #0A3E4D dark barrel interior

            // 3 HARD cel bands on outer face
            vec3 col = mix(cBase, cMid, step(0.32, vUv.y));
            col = mix(col, cTop, step(0.68, vUv.y));

            bool isBarrel = (vInner > 0.5) || (!gl_FrontFacing);
            if (isBarrel) {
              col = cBack;
              // Soft inner glow line #72F0F7 (~0.04 m wide) along the inside of the lip
              float innerGlow = smoothstep(0.84, 0.92, vUv.y) * smoothstep(0.99, 0.93, vUv.y);
              col = mix(col, cTop * 1.25, innerGlow * 0.88);
            } else {
              // 7 clearly visible hand-painted curved flow stripes (#D8FAFF, alpha 0.75) scrolling base->lip 3 m/s
              float stripeCoord = vUv.x * 7.0 + sin(vUv.y * 5.0 - uTime * 3.0) * 0.22;
              float stripeWave = abs(fract(stripeCoord) - 0.5);
              float breakup = fbm(vec2(vUv.x * 16.0 - uTime * 1.4, vUv.y * 6.0 - uTime * 3.0));
              float stripeMask = (1.0 - step(0.16, stripeWave)) * smoothstep(0.32, 0.48, breakup) * (1.0 - step(0.91, vUv.y));
              col = mix(col, vec3(0.847, 0.980, 1.0), stripeMask * 0.75);
            }

            // Lip edge band (last 10% of profile): solid foam white #EAFCFF with ragged noise edge
            float ragged = (vnoise(vec2(vUv.x * 22.0, uTime * 2.0)) - 0.5) * 0.045;
            float isLip = step(0.90 + ragged, vUv.y);
            col = mix(col, vec3(0.918, 0.988, 1.0), isLip);

            // F28 (2-frame) crisp white rim flash on the lip for anime accent
            if (uLipFlash > 0.01) {
              float flashBand = smoothstep(0.82, 0.93, vUv.y);
              col += vec3(1.0, 1.0, 1.0) * flashBand * uLipFlash * 0.95;
            }

            float alpha = mix(0.95, 0.72, vUv.y);
            alpha = mix(alpha, 0.97, isLip);
            if (isBarrel) alpha = max(alpha, 0.88);
            gl_FragColor = vec4(col, alpha);
          }
        `,
        });
      }

      function createSilverWaveOutlineShader() {
        return new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.BackSide,
          uniforms: { uVisibleArc: { value: 1.0 }, uDissolve: { value: 0.0 } },
          vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec3 displaced = position + normal * 0.03;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
          }
        `,
          fragmentShader: `
          uniform float uVisibleArc; uniform float uDissolve; varying vec2 vUv;
          void main() {
            if (vUv.x > uVisibleArc || uDissolve > 0.45) discard;
            gl_FragColor = vec4(0.020, 0.157, 0.212, 0.90 * (1.0 - uDissolve * 2.0));
          }
        `,
        });
      }

      function triggerSuongMaiWave() {
        if (activeStorm) activeStorm.absorbElement("hydro");
        const arc170 = THREE.MathUtils.degToRad(170);

        // Root group rotated +45 deg (caster's LEFT-FORWARD) so wave travels ACROSS the default camera!
        const waveRoot = new THREE.Group();
        waveRoot.rotation.y = Math.PI / 4; // +45° left-forward
        scene.add(waveRoot);

        // F0–F5 Anticipation ring & 20 rising droplets
        const antRingMat = new THREE.MeshBasicMaterial({
          color: 0x4de3e8,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        const antRing = new THREE.Mesh(new THREE.RingGeometry(0.92, 1.0, 48), antRingMat);
        antRing.rotation.x = -Math.PI / 2;
        antRing.position.y = 0.02;
        waveRoot.add(antRing);

        createSparkBurst(
          new THREE.Vector3(0, 0.04, 0),
          20,
          (i) => {
            const a = (i / 20) * Math.PI * 2,
              r = 0.45 + Math.random() * 0.55;
            return {
              ox: Math.cos(a) * r,
              oy: 0,
              oz: Math.sin(a) * r,
              vx: Math.cos(a) * 0.2,
              vy: 1.8 + Math.random() * 0.9,
              vz: Math.sin(a) * 0.2,
              size: 0.08,
              color: new THREE.Color(0xb8f6ff),
              drag: 0.8,
              gravity: -1.5,
              lifeFrames: 18,
            };
          },
          20,
          -1.5,
          true,
        );

        // Build CLOSED-VOLUME BufferGeometry (48 arc segs x 49 closed-loop rows)
        const cols = WAVE_ARC_SEGS + 1;
        const vCount = cols * WAVE_LOOP_ROWS;
        const positions = new Float32Array(vCount * 3);
        const uvs = new Float32Array(vCount * 2);
        const innerAttr = new Float32Array(vCount);
        const indices = [];

        for (let row = 0; row < WAVE_LOOP_ROWS; row++) {
          const isInner = row >= WAVE_PROF_PTS && row < WAVE_LOOP_ROWS - 1;
          const profIdx = row < WAVE_PROF_PTS ? row : row === WAVE_LOOP_ROWS - 1 ? 0 : WAVE_PROF_PTS * 2 - 1 - row;
          const v = profIdx / (WAVE_PROF_PTS - 1);
          for (let ia = 0; ia <= WAVE_ARC_SEGS; ia++) {
            const vi = row * cols + ia;
            uvs[vi * 2] = ia / WAVE_ARC_SEGS;
            uvs[vi * 2 + 1] = v;
            innerAttr[vi] = isInner ? 1.0 : 0.0;
          }
        }
        for (let row = 0; row < WAVE_LOOP_ROWS - 1; row++) {
          for (let ia = 0; ia < WAVE_ARC_SEGS; ia++) {
            const a = row * cols + ia,
              b = a + 1,
              c = a + cols,
              d = c + 1;
            indices.push(a, b, c, b, d, c);
          }
        }
        const waveGeo = new THREE.BufferGeometry();
        waveGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        waveGeo.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
        waveGeo.setAttribute("aInner", new THREE.BufferAttribute(innerAttr, 1));
        waveGeo.setIndex(indices);

        const waveMat = createSilverWaveShader();
        const waveMesh = new THREE.Mesh(waveGeo, waveMat);
        waveMesh.frustumCulled = false;
        const outlineWaveMat = createSilverWaveOutlineShader();
        const outlineWaveMesh = new THREE.Mesh(waveGeo, outlineWaveMat);
        outlineWaveMesh.frustumCulled = false;
        waveRoot.add(waveMesh, outlineWaveMesh);

        // 60 instanced foam crest blobs (F10–F48 wobble on lip, F48–F60 fall & fade)
        const FOAM_COUNT = 60;
        const foamMat = new THREE.MeshToonMaterial({ color: 0xeafcff, transparent: true, opacity: 0.95 });
        const foamInst = new THREE.InstancedMesh(SHARED.sphereLow, foamMat, FOAM_COUNT);
        foamInst.visible = false;
        waveRoot.add(foamInst);
        const foamData = Array.from({ length: FOAM_COUNT }, (_, i) => ({
          u: i / (FOAM_COUNT - 1),
          size: 0.12 + (i % 5) * 0.032,
          pos: new THREE.Vector3(),
          vy: 0,
        }));
        const foamDummy = new THREE.Object3D();

        // F22–F36 Crest Spray pool: 4 particles/frame x 15 frames = 60 particles, life 14F, white, 0.05–0.10m
        const SPRAY_MAX = 64;
        const spPos = new Float32Array(SPRAY_MAX * 3);
        const spCol = new Float32Array(SPRAY_MAX * 3);
        const spSize = new Float32Array(SPRAY_MAX);
        const spAlpha = new Float32Array(SPRAY_MAX);
        const spPool = [];
        for (let i = 0; i < SPRAY_MAX; i++) {
          spCol[i * 3] = 1;
          spCol[i * 3 + 1] = 1;
          spCol[i * 3 + 2] = 1;
          spSize[i] = 0.05 + Math.random() * 0.05;
          spAlpha[i] = 0;
          spPool.push({ alive: false, bornF: 0, vx: 0, vy: 0, vz: 0 });
        }
        const spGeo = new THREE.BufferGeometry();
        spGeo.setAttribute("position", new THREE.BufferAttribute(spPos, 3));
        spGeo.setAttribute("aColor", new THREE.BufferAttribute(spCol, 3));
        spGeo.setAttribute("aSize", new THREE.BufferAttribute(spSize, 1));
        spGeo.setAttribute("aAlpha", new THREE.BufferAttribute(spAlpha, 1));
        const spMat = createGpuSparkMaterial(THREE.AdditiveBlending, true);
        const crestSprayPts = new THREE.Points(spGeo, spMat);
        crestSprayPts.frustumCulled = false;
        waveRoot.add(crestSprayPts);
        let nextSprayIdx = 0;
        let lastSprayFrame = -1;

        // Ground wet decal (appears F30, dries F60–F96)
        const wetMat = createRuneDecalMaterial(wetDecalTex, 0x62ebf5, THREE.AdditiveBlending, 1.15);
        const wetMesh = new THREE.Mesh(new THREE.PlaneGeometry(10.5, 10.5), wetMat);
        wetMesh.rotation.x = -Math.PI / 2;
        wetMesh.position.set(0, 0.022, -2.0);
        wetMesh.visible = false;
        waveRoot.add(wetMesh);

        const profBuf = new Float32Array(WAVE_PROF_PTS * 2);
        const norm2d = new Float32Array(WAVE_PROF_PTS * 2);
        let crashed = false;
        let mistSpawned = false;

        addEffect({
          age: 0,
          durationFrames: 96,
          particleCount: FOAM_COUNT + SPRAY_MAX,
          isHero: true,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS;
            const fi = Math.floor(f);
            lastCastFrame = fi;

            // F0–F5 Anticipation ring
            if (f <= 10) {
              const rt = Math.min(f / 6, 1);
              antRing.visible = true;
              antRing.scale.setScalar(THREE.MathUtils.lerp(0.5, 2.0, rt));
              antRingMat.opacity = f <= 5 ? 0.9 : Math.max(0, 0.9 * (1 - (f - 5) / 5));
            } else {
              antRing.visible = false;
            }

            // Evaluate morphed 24-pt profile & 2D normals for closed-volume thickness (0.35 m -> 0.06 m)
            evalWaveProfile(f, profBuf);
            for (let ip = 0; ip < WAVE_PROF_PTS; ip++) {
              const iPrev = Math.max(0, ip - 1),
                iNext = Math.min(WAVE_PROF_PTS - 1, ip + 1);
              const td = profBuf[iNext * 2] - profBuf[iPrev * 2];
              const th = profBuf[iNext * 2 + 1] - profBuf[iPrev * 2 + 1];
              const len = Math.hypot(td, th) || 1;
              // Outward normal in (d, h) plane: (-th, td) / len (points UP/OUTWARD over crest)
              norm2d[ip * 2] = -th / len;
              norm2d[ip * 2 + 1] = td / len;
            }

            const visibleArc = f < 6 ? 1.0 : THREE.MathUtils.clamp((f - 6) / 24, 0.02, 1.0);
            waveMat.uniforms.uVisibleArc.value = visibleArc;
            outlineWaveMat.uniforms.uVisibleArc.value = visibleArc;
            waveMat.uniforms.uTime.value = this.age;
            waveMat.uniforms.uLipFlash.value = f >= 28 && f < 30 ? 1.0 : 0.0; // F28 2-frame white rim flash
            const dissolve = f > 64 ? THREE.MathUtils.clamp((f - 64) / 32, 0, 1) : 0;
            waveMat.uniforms.uDissolve.value = dissolve;
            outlineWaveMat.uniforms.uDissolve.value = dissolve;

            const posAttr = waveGeo.attributes.position;
            for (let row = 0; row < WAVE_LOOP_ROWS; row++) {
              const isInner = row >= WAVE_PROF_PTS && row < WAVE_LOOP_ROWS - 1;
              const ip = row < WAVE_PROF_PTS ? row : row === WAVE_LOOP_ROWS - 1 ? 0 : WAVE_PROF_PTS * 2 - 1 - row;
              const vFrac = ip / (WAVE_PROF_PTS - 1);
              const halfThick = THREE.MathUtils.lerp(0.35, 0.06, vFrac) * 0.5;
              const sign = isInner ? -1 : 1;
              const dOff = profBuf[ip * 2] + norm2d[ip * 2] * halfThick * sign;
              const hOff = Math.max(0, profBuf[ip * 2 + 1] + norm2d[ip * 2 + 1] * halfThick * sign);
              const r = 1.2 + dOff;

              for (let ia = 0; ia <= WAVE_ARC_SEGS; ia++) {
                const u = ia / WAVE_ARC_SEGS;
                const a = -arc170 / 2 + u * arc170;
                const endTaper = smoothstepJs(0.0, 0.15, u) * smoothstepJs(0.0, 0.15, 1.0 - u);
                let frontBump = 0;
                if (f >= 6 && f <= 32) {
                  const distToLead = Math.abs(u - visibleArc);
                  frontBump = Math.exp(-Math.pow(distToLead / 0.08, 2)) * 0.3 * vFrac;
                }
                const h = (hOff + frontBump) * endTaper;
                const idx3 = (row * cols + ia) * 3;
                posAttr.array[idx3 + 0] = Math.sin(a) * r;
                posAttr.array[idx3 + 1] = h;
                posAttr.array[idx3 + 2] = -Math.cos(a) * r;
              }
            }
            posAttr.needsUpdate = true;
            waveGeo.computeVertexNormals();

            // F22–F36 Crest spray: 4 white particles/frame from lip tip, 3–5 m/s forward-up, life 14F
            const lipD = profBuf[(WAVE_PROF_PTS - 1) * 2];
            const lipH = profBuf[(WAVE_PROF_PTS - 1) * 2 + 1];
            const lipR = 1.2 + lipD;
            if (fi >= 22 && fi <= 36 && fi > lastSprayFrame) {
              lastSprayFrame = fi;
              for (let k = 0; k < 4; k++) {
                const idx = nextSprayIdx % SPRAY_MAX;
                nextSprayIdx++;
                const u = 0.12 + Math.random() * Math.max(0.1, visibleArc - 0.16);
                const a = -arc170 / 2 + u * arc170;
                const endTaper = smoothstepJs(0.0, 0.15, u) * smoothstepJs(0.0, 0.15, 1.0 - u);
                const spd = 3.0 + Math.random() * 2.0;
                spPos[idx * 3] = Math.sin(a) * lipR;
                spPos[idx * 3 + 1] = Math.max(0.08, lipH * endTaper);
                spPos[idx * 3 + 2] = -Math.cos(a) * lipR;
                spPool[idx].alive = true;
                spPool[idx].bornF = f;
                spPool[idx].vx = Math.sin(a) * spd * 0.85;
                spPool[idx].vy = spd * 0.55 + Math.random() * 0.9;
                spPool[idx].vz = -Math.cos(a) * spd * 0.85;
              }
            }
            for (let i = 0; i < SPRAY_MAX; i++) {
              const p = spPool[i];
              if (!p.alive) {
                spAlpha[i] = 0;
                continue;
              }
              const ageF = f - p.bornF;
              if (ageF >= 14) {
                p.alive = false;
                spAlpha[i] = 0;
                continue;
              }
              p.vy -= 9.8 * dt;
              spPos[i * 3] += p.vx * dt;
              spPos[i * 3 + 1] = Math.max(0.03, spPos[i * 3 + 1] + p.vy * dt);
              spPos[i * 3 + 2] += p.vz * dt;
              spAlpha[i] = 1.0 - ageF / 14;
            }
            spGeo.attributes.position.needsUpdate = true;
            spGeo.attributes.aAlpha.needsUpdate = true;

            // Foam crest blobs: F10–F48 wobble on lip, F48–F60 fall & fade
            if (f >= 10 && f <= 60) {
              foamInst.visible = true;
              foamMat.opacity = f <= 48 ? 0.95 : Math.max(0, 0.95 * (1 - (f - 48) / 12));
              for (let i = 0; i < FOAM_COUNT; i++) {
                const fd = foamData[i];
                if (fd.u > visibleArc) {
                  foamDummy.scale.setScalar(0.0001);
                } else {
                  if (f <= 48) {
                    const a = -arc170 / 2 + fd.u * arc170;
                    const endTaper = smoothstepJs(0.0, 0.15, fd.u) * smoothstepJs(0.0, 0.15, 1.0 - fd.u);
                    const wobble = Math.sin(this.age * 16 + i * 2.3) * 0.08;
                    fd.pos.set(
                      Math.sin(a) * (lipR + wobble),
                      Math.max(0.05, (lipH + wobble) * endTaper),
                      -Math.cos(a) * (lipR + wobble),
                    );
                  } else {
                    fd.vy -= 9.8 * dt;
                    fd.pos.y = Math.max(0.04, fd.pos.y + fd.vy * dt);
                  }
                  foamDummy.position.copy(fd.pos);
                  const sc = fd.size * (f <= 48 ? 1.0 : Math.max(0.1, 1 - (f - 48) / 12));
                  foamDummy.scale.set(sc * 1.4, sc * 0.65, sc * 1.15);
                }
                foamDummy.updateMatrix();
                foamInst.setMatrixAt(i, foamDummy.matrix);
              }
              foamInst.instanceMatrix.needsUpdate = true;
            } else {
              foamInst.visible = false;
            }

            // F30 Wet ground decal appears, dries F60–F96
            if (f >= 30) {
              wetMesh.visible = true;
              wetMat.uniforms.uTime.value = this.age;
              wetMat.uniforms.uAlpha.value = f < 38 ? (f - 30) / 8 : 0.88;
              wetMat.uniforms.uDissolve.value = f > 60 ? THREE.MathUtils.clamp((f - 60) / 36, 0, 1) : 0;
            }

            // F36 CRASH: 3F hit-stop, shake 0.28 (12F), refraction, 8 spray sheets (F36–F54), 160 droplets (F36–F70)
            if (!crashed && f >= 36) {
              crashed = true;
              const crashWorld = new THREE.Vector3(0, 0.4, -4.6).applyAxisAngle(
                new THREE.Vector3(0, 1, 0),
                Math.PI / 4,
              );
              juice.triggerImpact(crashWorld, { hitStopFrames: 3, shake: 0.28, shakeFrames: 12, refract: 0.034 });
              spawnFlashLight(crashWorld.clone().setY(1.2), 0x72f0f7, 7.0, 11.0, 18);

              for (let k = 0; k < 8; k++) {
                const u = 0.14 + (k / 7) * 0.72;
                const a = -arc170 / 2 + u * arc170;
                const sheetGeo = new THREE.PlaneGeometry(0.8, 0.4, 4, 2);
                const sp = sheetGeo.attributes.position;
                for (let vi = 0; vi < sp.count; vi++) sp.setZ(vi, -sp.getX(vi) * sp.getX(vi) * 0.45);
                sheetGeo.computeVertexNormals();
                const sheetMat = new THREE.MeshBasicMaterial({
                  color: 0xeafcff,
                  transparent: true,
                  opacity: 0.8,
                  side: THREE.DoubleSide,
                  depthWrite: false,
                });
                const sheet = new THREE.Mesh(sheetGeo, sheetMat);
                sheet.position.set(Math.sin(a) * 4.5, 0.25, -Math.cos(a) * 4.5);
                sheet.rotation.y = -a;
                waveRoot.add(sheet);
                const spd = 4.0 + Math.random() * 2.0;
                const vel = new THREE.Vector3(Math.sin(a) * spd * 0.75, spd * 0.65, -Math.cos(a) * spd * 0.75);
                addEffect({
                  age: 0,
                  durationFrames: 18,
                  particleCount: 1,
                  update(dt2) {
                    this.age += dt2;
                    const sf = this.age * FPS;
                    sheet.position.addScaledVector(vel, dt2);
                    vel.y -= 9.8 * dt2;
                    sheet.rotation.x += dt2 * 2.2;
                    sheetMat.opacity = Math.max(0, 0.8 * (1 - sf / 18));
                    if (sf >= 18) {
                      waveRoot.remove(sheet);
                      sheetGeo.dispose();
                      sheetMat.dispose();
                      return false;
                    }
                    return true;
                  },
                });
              }

              // 160 GPU droplets rotated into waveRoot's +45° world frame
              const rot45 = Math.PI / 4;
              createSparkBurst(
                new THREE.Vector3(0, 0.18, 0),
                160,
                () => {
                  const u = 0.1 + Math.random() * 0.8;
                  const a = -arc170 / 2 + u * arc170 - rot45;
                  const elev = THREE.MathUtils.degToRad(30 + Math.random() * 40);
                  const spd = 3.0 + Math.random() * 4.0;
                  return {
                    ox: Math.sin(a) * 4.5,
                    oy: 0,
                    oz: -Math.cos(a) * 4.5,
                    vx: Math.sin(a) * Math.cos(elev) * spd,
                    vy: Math.sin(elev) * spd,
                    vz: -Math.cos(a) * Math.cos(elev) * spd,
                    size: 0.06 + Math.random() * 0.08,
                    color: new THREE.Color(Math.random() > 0.45 ? 0xffffff : 0x52e3eb),
                    drag: 0.4,
                    gravity: -9.8,
                    lifeFrames: 34,
                  };
                },
                34,
                -9.8,
                true,
              );
            }

            // F40–F80 Mist: 10 soft procedural hydro mist puffs along rotated crash line rising 0.4 m/s
            if (!mistSpawned && f >= 40) {
              mistSpawned = true;
              const rot45 = Math.PI / 4;
              for (let k = 0; k < 10; k++) {
                const u = 0.12 + (k / 9) * 0.76;
                const a = -arc170 / 2 + u * arc170 - rot45;
                spawnProceduralPuff(new THREE.Vector3(Math.sin(a) * 4.4, 0.35, -Math.cos(a) * 4.4), "hydro", {
                  baseSize: 1.35,
                  lifeFrames: 40,
                  riseStart: 0.45,
                  riseEnd: 0.35,
                });
              }
            }

            if (f >= this.durationFrames) {
              scene.remove(waveRoot);
              disposeObject(waveRoot);
              return false;
            }
            return true;
          },
        });

        // 8-second buff (UNCHANGED): two thin intertwined silver-water ribbons + 32 orbiting droplets
        const makeOrbitRibbon = (yBase, amp, radius, tiltZ, phase) => {
          const pts = [];
          for (let i = 0; i <= 48; i++) {
            const a = (i / 48) * Math.PI * 2;
            pts.push(
              new THREE.Vector3(Math.cos(a) * radius, yBase + Math.sin(a * 2 + phase) * amp, Math.sin(a) * radius),
            );
          }
          const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 64, 0.036, 6, true);
          const mat = createCelVfxMaterial({
            darkOutline: 0x0c3842,
            coreColor: 0x2496a6,
            midColor: 0x9ef4fa,
            rimColor: 0xffffff,
            scroll: [2.6, 0],
            noiseScale: [6.0, 1.0],
            opacity: 0.92,
            blending: THREE.AdditiveBlending,
            edgeSoftness: 0.01,
            emissiveBoost: 1.28,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.rotation.z = tiltZ;
          scene.add(mesh);
          return { mesh, mat };
        };
        const buffR1 = makeOrbitRibbon(1.05, 0.26, 0.92, 0.18, 0);
        const buffR2 = makeOrbitRibbon(1.18, 0.24, 1.06, -0.22, Math.PI);
        const dropCount = 32;
        const dPos = new Float32Array(dropCount * 3),
          dCol = new Float32Array(dropCount * 3),
          dSize = new Float32Array(dropCount),
          dAlpha = new Float32Array(dropCount);
        for (let i = 0; i < dropCount; i++) {
          dCol[i * 3] = 0.82;
          dCol[i * 3 + 1] = 0.98;
          dCol[i * 3 + 2] = 1.0;
          dSize[i] = 0.14 + (i % 3) * 0.05;
          dAlpha[i] = 1.0;
        }
        const dGeo = new THREE.BufferGeometry();
        dGeo.setAttribute("position", new THREE.BufferAttribute(dPos, 3));
        dGeo.setAttribute("aColor", new THREE.BufferAttribute(dCol, 3));
        dGeo.setAttribute("aSize", new THREE.BufferAttribute(dSize, 1));
        dGeo.setAttribute("aAlpha", new THREE.BufferAttribute(dAlpha, 1));
        const dMat = createGpuSparkMaterial(THREE.AdditiveBlending);
        const dPts = new THREE.Points(dGeo, dMat);
        scene.add(dPts);

        addEffect({
          age: 0,
          durationFrames: 480,
          particleCount: dropCount,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS,
              t = Math.min(f / this.durationFrames, 1);
            const fade = t < 0.05 ? t / 0.05 : t > 0.88 ? (1 - t) / 0.12 : 1.0;
            buffR1.mesh.rotation.y = this.age * 2.6;
            buffR2.mesh.rotation.y = -this.age * 2.1;
            for (const r of [buffR1, buffR2]) {
              r.mat.uniforms.uTime.value = this.age;
              r.mat.uniforms.uOpacity.value = fade * 0.9;
              r.mat.uniforms.uDissolve.value = t > 0.88 ? (t - 0.88) / 0.12 : 0;
            }
            const pa = dGeo.attributes.position,
              aa = dGeo.attributes.aAlpha;
            for (let i = 0; i < dropCount; i++) {
              const a = (i / dropCount) * Math.PI * 2 + this.age * (i % 2 ? 2.8 : -2.2);
              const r = 0.86 + (i % 4) * 0.09;
              pa.array[i * 3] = Math.cos(a) * r;
              pa.array[i * 3 + 1] = 0.65 + ((i * 0.17 + this.age * 0.35) % 1.25);
              pa.array[i * 3 + 2] = Math.sin(a) * r;
              aa.array[i] = fade * (0.5 + 0.5 * Math.sin(this.age * 16 + i * 2));
            }
            pa.needsUpdate = true;
            aa.needsUpdate = true;
            if (f >= this.durationFrames) {
              scene.remove(buffR1.mesh, buffR2.mesh, dPts);
              disposeObject(buffR1.mesh);
              disposeObject(buffR2.mesh);
              dGeo.dispose();
              dMat.dispose();
              return false;
            }
            return true;
          },
        });
      }

      // =========================================================================
      // EFFECT D: BẠCH VŨ — "WHITE STORM" (UNCHANGED)
      // =========================================================================
      function createHelicalRibbonGeometry(turns, height, rBottom, rTop, width, phase) {
        const segs = 72,
          pos = [],
          uvs = [],
          idx = [];
        for (let i = 0; i <= segs; i++) {
          const v = i / segs,
            a = phase + v * Math.PI * 2 * turns;
          const r = THREE.MathUtils.lerp(rBottom, rTop, Math.pow(v, 0.82));
          const y = v * height,
            w = width * Math.sin(v * Math.PI) * 0.9 + 0.08;
          pos.push(Math.cos(a) * r, y - w * 0.5, Math.sin(a) * r);
          pos.push(Math.cos(a) * r, y + w * 0.5, Math.sin(a) * r);
          uvs.push(0, v, 1, v);
          if (i < segs) {
            const k = i * 2;
            idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
          }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        return geo;
      }

      function triggerBachVuStorm() {
        const stormCenter = new THREE.Vector3(0, 0, -3.6);
        const stormGroup = new THREE.Group();
        stormGroup.position.copy(stormCenter);
        scene.add(stormGroup);
        juice.triggerImpact(stormCenter.clone().setY(1.8), {
          hitStopFrames: 3,
          shake: 0.18,
          shakeFrames: 10,
          refract: 0.022,
        });

        const runeMat = createRuneDecalMaterial(windRuneTex, 0x8cf5d8, THREE.AdditiveBlending, 1.3);
        const runeMesh = new THREE.Mesh(new THREE.PlaneGeometry(7.8, 7.8), runeMat);
        runeMesh.rotation.x = -Math.PI / 2;
        runeMesh.position.y = 0.028;
        stormGroup.add(runeMesh);

        const shaderMats = [],
          ribbons = [];
        for (let i = 0; i < 5; i++) {
          const geo = createHelicalRibbonGeometry(
            2.2 + (i % 2) * 0.5,
            5.2,
            0.52 + i * 0.08,
            2.35 + i * 0.12,
            0.42 + (i % 2) * 0.14,
            (i / 5) * Math.PI * 2,
          );
          const mat = createCelVfxMaterial({
            darkOutline: ELEMENTS.wind.dark,
            coreColor: ELEMENTS.wind.core,
            midColor: ELEMENTS.wind.mid,
            rimColor: ELEMENTS.wind.rim,
            scroll: [0, -2.6 - i * 0.25],
            noiseScale: [2.2, 5.5],
            opacity: 0.58,
            blending: THREE.NormalBlending,
            edgeSoftness: 0.18,
            emissiveBoost: 1.15,
          });
          const mesh = new THREE.Mesh(geo, mat);
          stormGroup.add(mesh);
          shaderMats.push(mat);
          ribbons.push({ mesh, speed: 3.1 + i * 0.35 });
        }

        const cloudRings = [];
        for (let i = 0; i < 2; i++) {
          const cMat = createCelVfxMaterial({
            darkOutline: ELEMENTS.wind.dark,
            coreColor: ELEMENTS.wind.core,
            midColor: ELEMENTS.wind.mid,
            rimColor: ELEMENTS.wind.rim,
            scroll: [1.8 * (i ? -1 : 1), 0],
            noiseScale: [4.5, 1.8],
            opacity: 0.48,
            blending: THREE.NormalBlending,
            edgeSoftness: 0.22,
            emissiveBoost: 1.1,
          });
          const cMesh = new THREE.Mesh(new THREE.TorusGeometry(2.05 + i * 0.45, 0.36, 8, 32), cMat);
          cMesh.rotation.x = Math.PI / 2;
          cMesh.position.y = 4.95 - i * 0.28;
          stormGroup.add(cMesh);
          shaderMats.push(cMat);
          cloudRings.push({ mesh: cMesh, speed: i ? -2.2 : 2.6 });
        }

        const blades = [];
        for (let i = 0; i < 7; i++) {
          const bMat = createCelVfxMaterial({
            darkOutline: ELEMENTS.wind.dark,
            coreColor: ELEMENTS.wind.core,
            midColor: ELEMENTS.wind.mid,
            rimColor: ELEMENTS.wind.rim,
            scroll: [2.4, 0],
            noiseScale: [3.2, 1.2],
            opacity: 0.88,
            blending: THREE.AdditiveBlending,
            edgeSoftness: 0.12,
            emissiveBoost: 1.32,
          });
          const bMesh = new THREE.Mesh(new THREE.RingGeometry(0.95, 1.36, 20, 1, 0, Math.PI * 0.92), bMat);
          bMesh.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.38;
          stormGroup.add(bMesh);
          shaderMats.push(bMat);
          blades.push({
            mesh: bMesh,
            y: 0.65 + i * 0.65,
            angle: (i / 7) * Math.PI * 2,
            radius: 1.25 + i * 0.22,
            speed: 5.2 + (i % 3) * 1.1,
          });
        }

        const feathers = [];
        for (let i = 0; i < 24; i++) {
          const fMesh = new THREE.Mesh(
            SHARED.quad,
            new THREE.MeshBasicMaterial({
              map: featherTex,
              transparent: true,
              opacity: 0.95,
              side: THREE.DoubleSide,
              depthWrite: false,
            }),
          );
          fMesh.scale.setScalar(0.42);
          stormGroup.add(fMesh);
          feathers.push({
            mesh: fMesh,
            angle: Math.random() * Math.PI * 2,
            radius: 2.6 + Math.random() * 2.1,
            y: Math.random() * 4.5,
            spd: 2.8 + Math.random() * 2.0,
            flutterPhase: Math.random() * 6.28,
          });
        }

        const LEAF_COUNT = 26;
        const leafMat = new THREE.MeshToonMaterial({ color: 0x9cf7dc, side: THREE.DoubleSide });
        const leafInst = new THREE.InstancedMesh(SHARED.quad, leafMat, LEAF_COUNT);
        stormGroup.add(leafInst);
        const leafDummy = new THREE.Object3D();

        const DUST_COUNT = 90;
        const dustPos = new Float32Array(DUST_COUNT * 3),
          dustCol = new Float32Array(DUST_COUNT * 3),
          dustSize = new Float32Array(DUST_COUNT),
          dustAlpha = new Float32Array(DUST_COUNT);
        for (let i = 0; i < DUST_COUNT; i++) {
          dustCol[i * 3] = 0.65;
          dustCol[i * 3 + 1] = 0.98;
          dustCol[i * 3 + 2] = 0.88;
          dustSize[i] = 0.12 + (i % 4) * 0.04;
          dustAlpha[i] = 0.85;
        }
        const dustGeo = new THREE.BufferGeometry();
        dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
        dustGeo.setAttribute("aColor", new THREE.BufferAttribute(dustCol, 3));
        dustGeo.setAttribute("aSize", new THREE.BufferAttribute(dustSize, 1));
        dustGeo.setAttribute("aAlpha", new THREE.BufferAttribute(dustAlpha, 1));
        const dustMat = createGpuSparkMaterial(THREE.AdditiveBlending);
        stormGroup.add(new THREE.Points(dustGeo, dustMat));

        let waveClimbing = false,
          waveY = -5.0;
        const targetRune = new THREE.Color(ELEMENTS.wind.decal);
        document.getElementById("stat-infuse").textContent = "Anemo";

        const stormHandle = {
          center: stormCenter,
          absorbElement(elemKey) {
            const p = ELEMENTS[elemKey];
            if (!p) return;
            waveClimbing = true;
            waveY = -0.3;
            targetRune.setHex(p.decal);
            leafMat.color.setHex(p.mid);
            for (const mat of shaderMats) {
              mat.uniforms.uAbsorbCore.value.setHex(p.core);
              mat.uniforms.uAbsorbMid.value.setHex(p.mid);
              mat.uniforms.uAbsorbRim.value.setHex(p.rim);
            }
            const c = new THREE.Color(p.rim),
              ca = dustGeo.attributes.aColor;
            for (let i = 0; i < DUST_COUNT; i++) {
              ca.array[i * 3] = c.r;
              ca.array[i * 3 + 1] = c.g;
              ca.array[i * 3 + 2] = c.b;
            }
            ca.needsUpdate = true;
            document.getElementById("stat-infuse").textContent = p.name;
            juice.triggerImpact(stormCenter.clone().setY(2.2), {
              hitStopFrames: 3,
              shake: 0.22,
              shakeFrames: 10,
              refract: 0.025,
            });
            spawnFlashLight(stormCenter.clone().setY(2.2), p.mid, 8.0, 12, 30);
          },
        };
        activeStorm = stormHandle;

        addEffect({
          age: 0,
          durationFrames: 336,
          particleCount: 24 + LEAF_COUNT + DUST_COUNT,
          isHero: true,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS;
            lastCastFrame = Math.floor(f);
            const t = Math.min(f / this.durationFrames, 1);
            const intro = Math.min(f / 20, 1);
            const outro = t > 0.8 ? (1 - t) / 0.2 : 1.0;

            if (waveClimbing) {
              waveY += dt * 7.5;
              if (waveY > 6.8) waveClimbing = false;
            }
            runeMesh.rotation.z = this.age * 0.78;
            runeMat.uniforms.uTime.value = this.age;
            runeMat.uniforms.uColor.value.lerp(targetRune, dt * 5.0);
            runeMat.uniforms.uAlpha.value = intro * outro * 0.92;
            runeMat.uniforms.uDissolve.value = 1 - outro;

            for (const mat of shaderMats) {
              mat.uniforms.uTime.value = this.age;
              mat.uniforms.uWaveY.value = waveY;
              mat.uniforms.uDissolve.value = (1 - outro) * 0.95;
            }
            for (const r of ribbons) {
              r.mesh.rotation.y += dt * r.speed;
              r.mesh.scale.setScalar(intro);
            }
            for (const c of cloudRings) {
              c.mesh.rotation.z += dt * c.speed;
              c.mesh.scale.setScalar(intro);
            }
            for (const b of blades) {
              b.angle += dt * b.speed;
              b.mesh.position.set(
                Math.cos(b.angle) * b.radius * intro,
                b.y + Math.sin(this.age * 3.5 + b.angle) * 0.25,
                Math.sin(b.angle) * b.radius * intro,
              );
              b.mesh.rotation.z = -b.angle;
            }
            for (const fe of feathers) {
              fe.angle += dt * fe.spd;
              fe.y = (fe.y + dt * 1.55) % 4.9;
              const pullR = THREE.MathUtils.lerp(fe.radius, 0.8 + (fe.y / 4.9) * 1.65, Math.min(1, this.age * 0.85));
              fe.mesh.position.set(Math.cos(fe.angle) * pullR, fe.y, Math.sin(fe.angle) * pullR);
              fe.mesh.rotation.set(
                Math.sin(this.age * 7 + fe.flutterPhase) * 0.9,
                fe.angle,
                Math.cos(this.age * 5.5 + fe.flutterPhase) * 0.8,
              );
              fe.mesh.material.opacity = intro * outro * 0.95;
            }
            for (let i = 0; i < LEAF_COUNT; i++) {
              const a = (i / LEAF_COUNT) * Math.PI * 2 + this.age * (3.6 + (i % 3) * 0.8);
              const r = (1.1 + (i % 5) * 0.48) * intro;
              leafDummy.position.set(
                Math.cos(a) * r,
                0.12 + Math.abs(Math.sin(this.age * 4 + i)) * 0.65,
                Math.sin(a) * r,
              );
              leafDummy.rotation.set(this.age * 5 + i, a, this.age * 4);
              leafDummy.scale.set(0.22 * outro, 0.11 * outro, 0.11 * outro);
              leafDummy.updateMatrix();
              leafInst.setMatrixAt(i, leafDummy.matrix);
            }
            leafInst.instanceMatrix.needsUpdate = true;

            const pa = dustGeo.attributes.position,
              aa = dustGeo.attributes.aAlpha;
            for (let i = 0; i < DUST_COUNT; i++) {
              const y = (i * 0.08 + this.age * 2.4) % 5.0;
              const a = i * 1.7 + this.age * (4.2 + (i % 3) * 0.7);
              const r = (0.35 + (y / 5.0) * 1.85) * intro;
              pa.array[i * 3] = Math.cos(a) * r;
              pa.array[i * 3 + 1] = y;
              pa.array[i * 3 + 2] = Math.sin(a) * r;
              aa.array[i] = intro * outro * Math.sin((y / 5.0) * Math.PI) * 0.88;
            }
            pa.needsUpdate = true;
            aa.needsUpdate = true;

            if (f >= this.durationFrames) {
              if (activeStorm === stormHandle) {
                activeStorm = null;
                document.getElementById("stat-infuse").textContent = "Anemo";
              }
              scene.remove(stormGroup);
              disposeObject(stormGroup);
              return false;
            }
            return true;
          },
        });
      }

      // =========================================================================
      // 6. INPUTS (1–4 CAST, 5 ORBIT, S 0.5×, F PAUSE/STEP, '.' +1 FRAME, R RESET)
      // =========================================================================
      let timeScale = 1.0;
      let debugPaused = false;
      let pendingStepFrames = 0;

      function flashBtn(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 160);
      }
      function toggleSlowMo() {
        timeScale = timeScale === 1.0 ? 0.5 : 1.0;
        const pill = document.getElementById("slowmo-badge");
        pill.textContent = timeScale < 1 ? "0.5×" : "1.0×";
        pill.classList.toggle("active", timeScale < 1);
        document.getElementById("btn-s").classList.toggle("toggled", timeScale < 1);
      }
      function toggleCinematicOrbit() {
        orbit.cinematic = !orbit.cinematic;
        const pill = document.getElementById("orbit-badge");
        pill.classList.toggle("orbit-on", orbit.cinematic);
        document.getElementById("btn-5").classList.toggle("toggled", orbit.cinematic);
      }
      function togglePause() {
        debugPaused = !debugPaused;
        const pill = document.getElementById("pause-badge");
        pill.textContent = debugPaused ? "PAUSED" : "RUN";
        pill.classList.toggle("paused-on", debugPaused);
        document.getElementById("btn-f").classList.toggle("toggled", debugPaused);
      }
      function stepOneFrame() {
        if (!debugPaused) togglePause();
        pendingStepFrames += 1;
        flashBtn("btn-dot");
      }

      document.getElementById("btn-1").addEventListener("click", () => {
        flashBtn("btn-1");
        triggerCatalystAttack();
      });
      document.getElementById("btn-2").addEventListener("click", () => {
        flashBtn("btn-2");
        triggerMaiLinhLantern();
      });
      document.getElementById("btn-3").addEventListener("click", () => {
        flashBtn("btn-3");
        triggerSuongMaiWave();
      });
      document.getElementById("btn-4").addEventListener("click", () => {
        flashBtn("btn-4");
        triggerBachVuStorm();
      });
      document.getElementById("btn-5").addEventListener("click", toggleCinematicOrbit);
      document.getElementById("btn-s").addEventListener("click", toggleSlowMo);
      document.getElementById("btn-f").addEventListener("click", togglePause);
      document.getElementById("btn-dot").addEventListener("click", stepOneFrame);

      window.addEventListener("keydown", (e) => {
        if (e.repeat && e.key !== ".") return;
        const k = e.key.toLowerCase();
        if (k === "1") {
          flashBtn("btn-1");
          triggerCatalystAttack();
        } else if (k === "2") {
          flashBtn("btn-2");
          triggerMaiLinhLantern();
        } else if (k === "3") {
          flashBtn("btn-3");
          triggerSuongMaiWave();
        } else if (k === "4") {
          flashBtn("btn-4");
          triggerBachVuStorm();
        } else if (k === "5") {
          toggleCinematicOrbit();
        } else if (k === "s") {
          toggleSlowMo();
        } else if (k === "f") {
          togglePause();
        } else if (e.key === "." || e.code === "Period") {
          stepOneFrame();
        } else if (k === "r") {
          orbit.reset();
        }
      });

      window.addEventListener("resize", () => {
        const w = window.innerWidth,
          h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        composer.setSize(w, h);
        bloomPass.resolution.set(w, h);
        shockwavePass.uniforms.uAspect.value = w / h;
      });

      // =========================================================================
      // 7. MAIN LOOP (EXACT FRAME STEPPING + 60 FPS TIMELINE)
      // =========================================================================
      let lastTime = performance.now();
      let elapsedVfx = 0;
      let fpsFrames = 0,
        fpsLast = lastTime,
        currentFps = 60;
      const statFps = document.getElementById("stat-fps");
      const statCalls = document.getElementById("stat-calls");
      const statParticles = document.getElementById("stat-particles");

      function stepSimulation(simDt) {
        juice.update(simDt);
        const effDt = juice.hitStopFrames > 0 ? 0 : simDt;
        elapsedVfx += effDt;
        if (effDt > 0) {
          updateBook(effDt, elapsedVfx);
          let pCount = 0;
          for (let i = activeEffects.length - 1; i >= 0; i--) {
            if (!activeEffects[i].update(effDt)) activeEffects.splice(i, 1);
            else pCount += activeEffects[i].particleCount || 0;
          }
          totalActiveParticles = pCount;
        }
      }

      function animate(now) {
        requestAnimationFrame(animate);
        const rawDt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        orbit.update(rawDt);

        if (debugPaused) {
          while (pendingStepFrames > 0) {
            pendingStepFrames--;
            stepSimulation(FRAME_DT);
          }
        } else {
          stepSimulation(rawDt * timeScale);
        }

        composer.render();

        fpsFrames++;
        if (now - fpsLast >= 200) {
          currentFps = Math.round((fpsFrames * 1000) / (now - fpsLast));
          fpsFrames = 0;
          fpsLast = now;
        }
        statFps.textContent = `${currentFps} • F${lastCastFrame}`;
        statCalls.textContent = String(renderer.info.render.calls);
        statParticles.textContent = String(totalActiveParticles);
      }

      window.addEventListener("load", () => {
        setTimeout(() => triggerSuongMaiWave(), 350);
      });
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
