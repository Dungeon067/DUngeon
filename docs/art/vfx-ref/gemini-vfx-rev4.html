<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tinh Tú Ước Nguyện — Frame-Accurate Anime VFX (Rev 4)</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #080b12;
        --panel: rgba(12, 16, 26, 0.82);
        --border: rgba(148, 185, 235, 0.24);
        --text: #f0f6ff;
        --muted: #8fa4c6;
        --accent: #5cd6ff;
        --gold: #ffd45a;
        --red: #ff6b6b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #canvas-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud-top {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        pointer-events: none;
        z-index: 10;
      }
      .title-card,
      .stats-card {
        background: var(--panel);
        border: 1px solid var(--border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 9px 13px;
        pointer-events: auto;
      }
      .title-card h1 {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(92, 214, 255, 0.16);
        color: var(--accent);
        border: 1px solid rgba(92, 214, 255, 0.35);
        text-transform: uppercase;
      }
      .title-card p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
        line-height: 1.4;
      }
      .stats-card {
        font-size: 11px;
        color: var(--muted);
        text-align: right;
        min-width: 184px;
        font-variant-numeric: tabular-nums;
      }
      .stats-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        line-height: 1.5;
      }
      .stats-row strong {
        color: var(--text);
        font-weight: 600;
      }
      .pill-row {
        display: flex;
        justify-content: flex-end;
        gap: 5px;
        margin-top: 5px;
        flex-wrap: wrap;
      }
      .status-pill {
        display: inline-block;
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        border: 1px solid var(--border);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
      }
      .status-pill.active {
        color: #0e131f;
        background: var(--gold);
        border-color: var(--gold);
      }
      .status-pill.orbit-on {
        color: #0b1620;
        background: var(--accent);
        border-color: var(--accent);
      }
      .status-pill.paused-on {
        color: #fff;
        background: #d63636;
        border-color: #ff6b6b;
      }

      .hud-bottom {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 6px;
        padding: 7px 9px;
        background: var(--panel);
        border: 1px solid var(--border);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 15px;
        z-index: 10;
        max-width: calc(100vw - 20px);
      }
      .skill-btn {
        display: flex;
        align-items: center;
        gap: 7px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 7px 9px;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          border-color 0.15s ease,
          background 0.15s ease;
        font-family: inherit;
      }
      .skill-btn:hover {
        background: rgba(255, 255, 255, 0.11);
        border-color: rgba(255, 255, 255, 0.34);
      }
      .skill-btn:active {
        transform: scale(0.95);
      }
      .skill-btn.flash {
        border-color: var(--accent);
        background: rgba(92, 214, 255, 0.22);
      }
      .skill-btn.toggled {
        border-color: var(--gold);
        background: rgba(255, 212, 90, 0.18);
      }
      .keycap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.13);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.24);
      }
      .btn-meta {
        text-align: left;
        line-height: 1.18;
      }
      .btn-title {
        font-size: 11px;
        font-weight: 600;
        display: block;
        white-space: nowrap;
      }
      .btn-sub {
        font-size: 9.5px;
        color: var(--muted);
        display: block;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
        box-shadow: 0 0 8px currentColor;
      }

      @media (max-width: 960px) {
        .hud-bottom {
          flex-wrap: wrap;
        }
        .title-card p {
          display: none;
        }
        .btn-sub {
          display: none;
        }
        .skill-btn {
          padding: 6px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div class="hud-top">
      <div class="title-card">
        <h1>TINH TÚ ƯỚC NGUYỆN <span class="badge">60 FPS Spec • Rev 4</span></h1>
        <p>
          <b>1–4</b> cast &bull; <b>5</b> orbit &bull; <b>S</b> 0.5× slow-mo &bull; <b>F</b> pause/resume &bull;
          <b>.</b> +1 frame &bull; <b>R</b> reset cam
        </p>
      </div>
      <div class="stats-card">
        <div class="stats-row"><span>FPS / Frame</span><strong id="stat-fps">60 • F0</strong></div>
        <div class="stats-row"><span>Draw Calls</span><strong id="stat-calls">0</strong></div>
        <div class="stats-row"><span>Particles</span><strong id="stat-particles">0</strong></div>
        <div class="stats-row"><span>Storm Infuse</span><strong id="stat-infuse">Anemo</strong></div>
        <div class="pill-row">
          <span id="pause-badge" class="status-pill">RUN</span>
          <span id="orbit-badge" class="status-pill">ORBIT</span>
          <span id="slowmo-badge" class="status-pill">1.0×</span>
        </div>
      </div>
    </div>

    <div class="hud-bottom">
      <button class="skill-btn" id="btn-1" type="button">
        <span class="keycap">1</span>
        <span class="dot" id="dot-catalyst" style="color: #24b0ff; background: #24b0ff"></span>
        <span class="btn-meta">
          <span class="btn-title">Catalyst</span>
          <span class="btn-sub" id="sub-catalyst">Next: Hydro</span>
        </span>
      </button>
      <button class="skill-btn" id="btn-2" type="button">
        <span class="keycap">2</span>
        <span class="dot" style="color: #ff5738; background: #ff5738"></span>
        <span class="btn-meta">
          <span class="btn-title">Plum Lantern</span>
          <span class="btn-sub">Mai Linh • Fire</span>
        </span>
      </button>
      <button class="skill-btn" id="btn-3" type="button">
        <span class="keycap">3</span>
        <span class="dot" style="color: #4de3e8; background: #4de3e8"></span>
        <span class="btn-meta">
          <span class="btn-title">Silver Wave</span>
          <span class="btn-sub">Sương Mai • 96F</span>
        </span>
      </button>
      <button class="skill-btn" id="btn-4" type="button">
        <span class="keycap">4</span>
        <span class="dot" style="color: #7cf5d4; background: #7cf5d4"></span>
        <span class="btn-meta">
          <span class="btn-title">White Storm</span>
          <span class="btn-sub">Bạch Vũ • Wind</span>
        </span>
      </button>
      <button class="skill-btn" id="btn-5" type="button">
        <span class="keycap">5</span>
        <span class="btn-meta">
          <span class="btn-title">Orbit</span>
          <span class="btn-sub">Cinematic</span>
        </span>
      </button>
      <button class="skill-btn" id="btn-s" type="button">
        <span class="keycap">S</span>
        <span class="btn-meta">
          <span class="btn-title">0.5×</span>
          <span class="btn-sub">Slow-Mo</span>
        </span>
      </button>
      <button class="skill-btn" id="btn-f" type="button">
        <span class="keycap">F</span>
        <span class="btn-meta">
          <span class="btn-title">Pause</span>
          <span class="btn-sub">Frame Step</span>
        </span>
      </button>
      <button class="skill-btn" id="btn-dot" type="button">
        <span class="keycap">.</span>
        <span class="btn-meta">
          <span class="btn-title">+1F</span>
          <span class="btn-sub">Step</span>
        </span>
      </button>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const FPS = 60;
      const FRAME_DT = 1 / FPS;

      // =========================================================================
      // 1. RENDERER, POST-PROCESSING (BLOOM + SHOCKWAVE REFRACTION), CAMERA
      // =========================================================================
      const container = document.getElementById("canvas-container");
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
        alpha: false,
      });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.02;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x080b12);
      scene.fog = new THREE.FogExp2(0x080b12, 0.026);

      const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);

      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(dpr);
      composer.setSize(window.innerWidth, window.innerHeight);
      composer.addPass(new RenderPass(scene, camera));

      const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.56, 0.36, 0.85);
      composer.addPass(bloomPass);

      const ShockwaveShader = {
        uniforms: {
          tDiffuse: { value: null },
          uCenter: { value: new THREE.Vector2(0.5, 0.5) },
          uRadius: { value: 0.0 },
          uWidth: { value: 0.09 },
          uStrength: { value: 0.0 },
          uAspect: { value: window.innerWidth / window.innerHeight },
        },
        vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `,
        fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 uCenter;
        uniform float uRadius;
        uniform float uWidth;
        uniform float uStrength;
        uniform float uAspect;
        varying vec2 vUv;
        void main() {
          if (uStrength <= 0.0005) { gl_FragColor = texture2D(tDiffuse, vUv); return; }
          vec2 delta = vUv - uCenter;
          vec2 aspectDelta = vec2(delta.x * uAspect, delta.y);
          float dist = length(aspectDelta);
          float ring = smoothstep(uRadius - uWidth, uRadius, dist) * (1.0 - smoothstep(uRadius, uRadius + uWidth, dist));
          vec2 dir = dist > 0.0001 ? normalize(aspectDelta) : vec2(0.0);
          vec2 offset = vec2(dir.x / uAspect, dir.y) * ring * uStrength;
          float r = texture2D(tDiffuse, vUv + offset * 1.15).r;
          float g = texture2D(tDiffuse, vUv + offset).g;
          float b = texture2D(tDiffuse, vUv + offset * 0.85).b;
          gl_FragColor = vec4(r, g, b, 1.0);
        }
      `,
      };
      const shockwavePass = new ShaderPass(ShockwaveShader);
      composer.addPass(shockwavePass);
      composer.addPass(new OutputPass());

      // Frame-accurate juice controller (hit-stop in exact frames, shake decay in frames)
      const juice = {
        hitStopFrames: 0,
        hitStopAccum: 0,
        shakeAmp: 0,
        shakeDecayFrames: 12,
        shakeAge: 0,
        shakeOffset: new THREE.Vector3(),
        waveActive: false,
        waveAge: 0,
        waveDur: 0.34,
        waveStrength: 0.03,
        triggerImpact(worldPos, { hitStopFrames = 3, shake = 0.24, shakeFrames = 12, refract = 0.028 } = {}) {
          this.hitStopFrames = Math.max(this.hitStopFrames, hitStopFrames);
          if (shake > this.shakeAmp) {
            this.shakeAmp = shake;
            this.shakeDecayFrames = shakeFrames;
            this.shakeAge = 0;
          }
          if (refract > 0) {
            const p = worldPos.clone().project(camera);
            shockwavePass.uniforms.uCenter.value.set((p.x + 1) * 0.5, (p.y + 1) * 0.5);
            this.waveActive = true;
            this.waveAge = 0;
            this.waveStrength = refract;
          }
        },
        update(dt) {
          if (this.hitStopFrames > 0) {
            this.hitStopAccum += dt;
            while (this.hitStopAccum >= FRAME_DT && this.hitStopFrames > 0) {
              this.hitStopAccum -= FRAME_DT;
              this.hitStopFrames--;
            }
          } else {
            this.hitStopAccum = 0;
          }
          if (this.shakeAmp > 0.001) {
            this.shakeAge += dt;
            const decayDur = this.shakeDecayFrames * FRAME_DT;
            const remain = Math.max(0, 1 - this.shakeAge / decayDur);
            const cur = this.shakeAmp * remain;
            this.shakeOffset.set(
              (Math.random() - 0.5) * 2 * cur,
              (Math.random() - 0.5) * 2 * cur,
              (Math.random() - 0.5) * 2 * cur,
            );
            if (remain <= 0) {
              this.shakeAmp = 0;
              this.shakeOffset.set(0, 0, 0);
            }
          } else {
            this.shakeOffset.set(0, 0, 0);
          }
          if (this.waveActive) {
            this.waveAge += dt;
            const t = Math.min(this.waveAge / this.waveDur, 1);
            shockwavePass.uniforms.uRadius.value = 0.04 + t * 0.68;
            shockwavePass.uniforms.uStrength.value = this.waveStrength * (1 - t) * (1 - t);
            if (t >= 1) {
              this.waveActive = false;
              shockwavePass.uniforms.uStrength.value = 0;
            }
          }
        },
      };

      const orbit = {
        target: new THREE.Vector3(0, 1.35, -1.75),
        spherical: new THREE.Spherical(8.2, 1.22, 0.46),
        desiredSpherical: new THREE.Spherical(8.2, 1.22, 0.46),
        desiredTarget: new THREE.Vector3(0, 1.35, -1.75),
        cinematic: false,
        isDragging: false,
        dragMode: "rotate",
        lastX: 0,
        lastY: 0,
        reset() {
          this.desiredTarget.set(0, 1.35, -1.75);
          this.desiredSpherical.set(8.2, 1.22, 0.46);
        },
        update(rawDt) {
          if (this.cinematic && !this.isDragging) this.desiredSpherical.theta += rawDt * 0.42;
          const k = 1 - Math.exp(-10 * rawDt);
          this.spherical.radius += (this.desiredSpherical.radius - this.spherical.radius) * k;
          this.spherical.phi += (this.desiredSpherical.phi - this.spherical.phi) * k;
          this.spherical.theta += (this.desiredSpherical.theta - this.spherical.theta) * k;
          this.target.lerp(this.desiredTarget, k);
          const offset = new THREE.Vector3().setFromSpherical(this.spherical);
          camera.position.copy(this.target).add(offset).add(juice.shakeOffset);
          camera.lookAt(this.target.clone().addScaledVector(juice.shakeOffset, 0.45));
        },
      };
      orbit.update(1);

      const dom = renderer.domElement;
      dom.addEventListener("contextmenu", (e) => e.preventDefault());
      dom.addEventListener("pointerdown", (e) => {
        orbit.isDragging = true;
        orbit.dragMode = e.button === 2 || e.shiftKey ? "pan" : "rotate";
        orbit.lastX = e.clientX;
        orbit.lastY = e.clientY;
        dom.setPointerCapture(e.pointerId);
      });
      dom.addEventListener("pointermove", (e) => {
        if (!orbit.isDragging) return;
        const dx = e.clientX - orbit.lastX,
          dy = e.clientY - orbit.lastY;
        orbit.lastX = e.clientX;
        orbit.lastY = e.clientY;
        if (orbit.dragMode === "rotate") {
          orbit.desiredSpherical.theta -= dx * 0.0065;
          orbit.desiredSpherical.phi = THREE.MathUtils.clamp(orbit.desiredSpherical.phi - dy * 0.006, 0.25, 1.48);
        } else {
          const s = orbit.desiredSpherical.radius * 0.0014;
          const r = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
          const u = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
          orbit.desiredTarget.addScaledVector(r, -dx * s).addScaledVector(u, dy * s);
        }
      });
      const endDrag = () => {
        orbit.isDragging = false;
      };
      dom.addEventListener("pointerup", endDrag);
      dom.addEventListener("pointercancel", endDrag);
      dom.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          orbit.desiredSpherical.radius = THREE.MathUtils.clamp(
            orbit.desiredSpherical.radius * (1 + Math.sign(e.deltaY) * 0.09),
            3.8,
            22,
          );
        },
        { passive: false },
      );

      // =========================================================================
      // 2. PROCEDURAL 512px CANVAS TEXTURES & FLIPBOOKS
      // =========================================================================
      function makeCanvasTex(size, drawFn, repeat = false) {
        const c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        const ctx = c.getContext("2d");
        drawFn(ctx, size);
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
        tex.wrapT = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
      }

      function makeFlipbookTex(size, drawFrame) {
        return makeCanvasTex(size, (ctx, s) => {
          ctx.clearRect(0, 0, s, s);
          const cell = s / 4;
          for (let f = 0; f < 16; f++) {
            const col = f % 4,
              row = Math.floor(f / 4);
            ctx.save();
            ctx.beginPath();
            ctx.rect(col * cell, row * cell, cell, cell);
            ctx.clip();
            ctx.translate(col * cell, row * cell);
            drawFrame(ctx, cell, f / 15, f);
            ctx.restore();
          }
        });
      }

      const flameFlipbook = makeFlipbookTex(512, (ctx, s, t) => {
        const cx = s * 0.5,
          base = s * 0.92;
        const h = s * (0.35 + Math.sin(t * Math.PI) * 0.54);
        const w = s * (0.28 + Math.sin(t * Math.PI * 0.85) * 0.16) * (1 - t * 0.35);
        const sway = Math.sin(t * Math.PI * 3.0) * s * 0.08;
        const drawT = (ox, oy, tw, th, fill, stroke) => {
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.bezierCurveTo(ox - tw, oy - th * 0.35, ox - tw * 0.55 + sway, oy - th * 0.78, ox + sway, oy - th);
          ctx.bezierCurveTo(ox + tw * 0.55 + sway, oy - th * 0.78, ox + tw, oy - th * 0.35, ox, oy);
          ctx.fillStyle = fill;
          ctx.fill();
          if (stroke) {
            ctx.lineWidth = 3.2;
            ctx.strokeStyle = stroke;
            ctx.stroke();
          }
        };
        ctx.globalAlpha = Math.max(0, 1 - Math.pow(t, 2.2));
        drawT(cx - w * 0.55, base, w * 0.55, h * 0.75, "#c91a0a", "#4a0602");
        drawT(cx + w * 0.55, base, w * 0.55, h * 0.72, "#c91a0a", "#4a0602");
        drawT(cx, base, w, h, "#ff531a", "#5c0c04");
        drawT(cx, base - 4, w * 0.58, h * 0.68, "#ffcf48", null);
        drawT(cx, base - 6, w * 0.28, h * 0.36, "#fff0a8", null);
      });

      const splashFlipbook = makeFlipbookTex(512, (ctx, s, t) => {
        const cx = s * 0.5,
          base = s * 0.88;
        const spread = 0.35 + Math.sin(t * Math.PI * 0.75) * 0.52;
        const h = s * (0.25 + Math.sin(t * Math.PI) * 0.58);
        ctx.globalAlpha = Math.max(0, 1 - Math.pow(t, 2.0));
        ctx.beginPath();
        ctx.moveTo(cx - s * 0.42 * spread, base);
        for (let i = 0; i <= 6; i++) {
          const u = i / 6,
            px = cx + (u - 0.5) * s * 0.86 * spread;
          const spike = i % 2 === 1 ? h * (0.82 + 0.18 * Math.sin(i + t * 5)) : h * 0.42;
          ctx.lineTo(px, base - spike);
        }
        ctx.lineTo(cx + s * 0.42 * spread, base);
        ctx.closePath();
        ctx.fillStyle = "#189ce8";
        ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = "#07345e";
        ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) {
          const u = i / 6,
            px = cx + (u - 0.5) * s * 0.76 * spread;

      const GLSL_NOISE = `
      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float vnoise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
          mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x),
          f.y
        );
      }
      float fbm(vec2 p) {
        return 0.62 * vnoise(p) + 0.38 * vnoise(p * 2.13 + vec2(3.7, 1.9));
      }
      float fbm3(vec2 p) {
        float v = 0.0;
        v += 0.55 * vnoise(p);
        v += 0.30 * vnoise(p * 2.07 + vec2(4.1, 1.7));
        v += 0.15 * vnoise(p * 4.21 + vec2(1.3, 6.2));
        return v;
      }
    `;

      function createCelVfxMaterial({
        darkOutline = 0x091628,
        coreColor = 0x104070,
        midColor = 0x24b0ff,
        rimColor = 0xc8f4ff,
        scroll = [0.0, -2.0],
        noiseScale = [3.0, 4.0],
        fresnelPower = 2.2,
        opacity = 0.92,
        dissolve = 0.0,
        blending = THREE.NormalBlending,
        side = THREE.DoubleSide,
        edgeSoftness = 0.1,
        emissiveBoost = 1.0,
      } = {}) {
        return new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending,
          side,
          uniforms: {
            uTime: { value: 0 },
            uOutlineColor: { value: new THREE.Color(darkOutline) },
            uCoreColor: { value: new THREE.Color(coreColor) },
            uMidColor: { value: new THREE.Color(midColor) },
            uRimColor: { value: new THREE.Color(rimColor) },
            uAbsorbCore: { value: new THREE.Color(coreColor) },
            uAbsorbMid: { value: new THREE.Color(midColor) },
            uAbsorbRim: { value: new THREE.Color(rimColor) },
            uWaveY: { value: -5.0 },
            uScroll: { value: new THREE.Vector2(scroll[0], scroll[1]) },
            uNoiseScale: { value: new THREE.Vector2(noiseScale[0], noiseScale[1]) },
            uFresnelPow: { value: fresnelPower },
            uOpacity: { value: opacity },
            uDissolve: { value: dissolve },
            uEdgeSoft: { value: edgeSoftness },
            uBoost: { value: emissiveBoost },
          },
          vertexShader: `
          varying vec2 vUv; varying vec3 vNormalW; varying vec3 vViewDirW; varying float vLocalY;
          void main() {
            vUv = uv; vLocalY = position.y;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vNormalW = normalize(mat3(modelMatrix) * normal);
            vViewDirW = normalize(cameraPosition - wp.xyz);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
          fragmentShader: `
          uniform float uTime; uniform vec3 uOutlineColor;
          uniform vec3 uCoreColor; uniform vec3 uMidColor; uniform vec3 uRimColor;
          uniform vec3 uAbsorbCore; uniform vec3 uAbsorbMid; uniform vec3 uAbsorbRim;
          uniform float uWaveY; uniform vec2 uScroll; uniform vec2 uNoiseScale;
          uniform float uFresnelPow; uniform float uOpacity; uniform float uDissolve;
          uniform float uEdgeSoft; uniform float uBoost;
          varying vec2 vUv; varying vec3 vNormalW; varying vec3 vViewDirW; varying float vLocalY;
          ${GLSL_NOISE}
          void main() {
            float n = fbm(vUv * uNoiseScale + uScroll * uTime);
            float edgeMask = smoothstep(0.0, uEdgeSoft, vUv.x) * smoothstep(1.0, 1.0 - uEdgeSoft, vUv.x)
                           * smoothstep(0.0, uEdgeSoft, vUv.y) * smoothstep(1.0, 1.0 - uEdgeSoft, vUv.y);
            float erode = smoothstep(uDissolve, uDissolve + 0.14, n * edgeMask);
            if (erode < 0.02) discard;
            float absorbMix = smoothstep(uWaveY + 0.55, uWaveY - 0.55, vLocalY);
            float waveFlash = exp(-pow((vLocalY - uWaveY) * 2.2, 2.0)) * step(-0.5, uWaveY);
            vec3 cCore = mix(uCoreColor, uAbsorbCore, absorbMix);
            vec3 cMid  = mix(uMidColor,  uAbsorbMid,  absorbMix);
            vec3 cRim  = mix(uRimColor,  uAbsorbRim,  absorbMix);
            vec3 col = mix(cCore, cMid, smoothstep(0.28, 0.34, n));
            col = mix(col, cRim, smoothstep(0.62, 0.68, n) * 0.8);
            float ndv = abs(dot(normalize(vNormalW), normalize(vViewDirW)));
            float fres = pow(1.0 - clamp(ndv, 0.0, 1.0), uFresnelPow);
            col = mix(col, cRim, smoothstep(0.45, 0.58, fres) * 0.72);
            col = mix(col, uOutlineColor, smoothstep(0.18, 0.04, erode) * 0.65);
            col += cRim * waveFlash * 0.65;
            col = min(col * uBoost, cRim * 1.18 + vec3(0.08));
            gl_FragColor = vec4(col, erode * uOpacity);
          }
        `,
        });

      function createFlipbookMaterial(texture, tintHex = 0xffffff, blending = THREE.NormalBlending, boost = 1.15) {
        return new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending,
          side: THREE.DoubleSide,

            uMap: { value: texture },
            uTint: { value: new THREE.Color(tintHex) },
            uFrame: { value: 0 },
            uAlpha: { value: 1.0 },
            uBoost: { value: boost },

          vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
          uniform sampler2D uMap; uniform vec3 uTint; uniform float uFrame; uniform float uAlpha; uniform float uBoost;
          varying vec2 vUv;
          void main() {
            float f = floor(clamp(uFrame, 0.0, 15.0));
            vec2 uv = (vec2(mod(f, 4.0), 3.0 - floor(f / 4.0)) + vUv) * 0.25;
            vec4 tex = texture2D(uMap, uv);
            if (tex.a * uAlpha < 0.02) discard;
            gl_FragColor = vec4(tex.rgb * uTint * uBoost, tex.a * uAlpha);
          }
        `,
        });

          uniform sampler2D uMap; uniform vec3 uColor; uniform float uTime; uniform float uAlpha; uniform float uDissolve; uniform float uBoost;
          varying vec2 vUv;
          ${GLSL_NOISE}

            float pulse = 0.88 + 0.12 * sin(uTime * 6.5);
            float a = tex.a * mask * uAlpha;
            if (a < 0.01) discard;
            gl_FragColor = vec4(tex.rgb * uColor * pulse * uBoost, a);

        `,
        });

        return new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending,
          uniforms: { uPixelRatio: { value: dpr }, uOpacity: { value: 1.0 } },
          vertexShader: `
          attribute float aSize; attribute vec3 aColor; attribute float aAlpha;

            vec4 mv = modelViewMatrix * vec4(position, 1.0);

            gl_Position = projectionMatrix * mv;

          varying vec3 vColor; varying float vAlpha; uniform float uOpacity;
          void main() {
            float d = length(gl_PointCoord * 2.0 - 1.0);
            float a = smoothstep(1.0, 0.25, d) * vAlpha * uOpacity;

            float star = max(1.0 - d, max(0.0, 1.0 - (abs(p.x) * 3.2 + abs(p.y) * 0.9)) + max(0.0, 1.0 - (abs(p.y) * 3.2 + abs(p.x) * 0.9)));
            float a = smoothstep(0.12, 0.55, star) * vAlpha * uOpacity;
            if (a < 0.02) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        });

      function createSparkBurst(origin, count, initParticleFn, durationFrames, gravity = -7.5, roundMode = false) {
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const sizes = new Float32Array(count);
        const alphas = new Float32Array(count);
        const data = [];
        for (let i = 0; i < count; i++) {
          const p = initParticleFn(i, count);
          data.push(p);
          positions[i * 3] = origin.x + (p.ox || 0);
          positions[i * 3 + 1] = origin.y + (p.oy || 0);
          positions[i * 3 + 2] = origin.z + (p.oz || 0);
          colors[i * 3] = p.color.r;
          colors[i * 3 + 1] = p.color.g;
          colors[i * 3 + 2] = p.color.b;
          sizes[i] = p.size;
          alphas[i] = 1.0;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geo.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
        geo.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
        geo.setAttribute("aAlpha", new THREE.BufferAttribute(alphas, 1));
        const mat = createGpuSparkMaterial(THREE.AdditiveBlending, roundMode);
        const pts = new THREE.Points(geo, mat);
        pts.frustumCulled = false;
        scene.add(pts);

        addEffect({
          age: 0,
          durationFrames,
          particleCount: count,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS;
            const posAttr = geo.attributes.position;
            const alphaAttr = geo.attributes.aAlpha;
            for (let i = 0; i < count; i++) {
              const p = data[i];
              const localF = f - (p.delayFrames || 0);
              if (localF < 0) {
                alphaAttr.array[i] = 0;
                continue;
              }
              const lifeF = p.lifeFrames || this.durationFrames;
              const localT = Math.min(localF / Math.max(1, lifeF), 1);
              p.vx *= Math.exp(-(p.drag || 1.2) * dt);
              p.vz *= Math.exp(-(p.drag || 1.2) * dt);
              p.vy += (p.gravity !== undefined ? p.gravity : gravity) * dt;
              posAttr.array[i * 3] += p.vx * dt;
              posAttr.array[i * 3 + 1] = Math.max(0.03, posAttr.array[i * 3 + 1] + p.vy * dt);
              posAttr.array[i * 3 + 2] += p.vz * dt;
              const twinkle = p.twinkle ? 0.55 + 0.45 * Math.sin(this.age * 36 + i) : 1.0;
              alphaAttr.array[i] = Math.max(0, 1 - Math.pow(localT, 1.4)) * twinkle;
            }
            posAttr.needsUpdate = true;
            alphaAttr.needsUpdate = true;
            if (f >= this.durationFrames) {
              scene.remove(pts);
              geo.dispose();
              mat.dispose();
              return false;
            }
            return true;
          },
        });
      }

      // =========================================================================
      // FIX B — SOFT PROCEDURAL SDF SMOKE / MIST PUFF SHADER (40 FRAMES, NO OUTLINE)
      // =========================================================================
      /*
       * FRAME TABLE — SOFT PROCEDURAL SMOKE / MIST PUFF (40 frames default, 60 fps):
       *   F0       : scale 0.5, alpha 0.0 (9 overlapping circles, feathered edge 0.08, no outline)
       *   F0–F10   : scale 0.5 -> 1.2, alpha 0.0 -> 1.0
       *   F10–F40  : scale 1.2 -> 2.0, rises 0.8 -> 0.2 m/s, rotates 20 deg/s
       *   F20–F40  : edge noise erosion dissolve 0.0 -> 1.0
       *   F40      : removed & disposed
       *   Palettes (light / shadow, max alpha):
       *     pyro  : #CFC6C0 / #9C8F88 (max alpha 0.60) + #FF7A2A bottom 20% underglow (alpha 0.35)
       *     hydro : #FFFFFF / #CDEFF5 (max alpha 0.55)
       *     cryo  : #F2FBFF / #BFE4F7 (max alpha 0.55) + 6 interior sparkle glints
       */
      const PUFF_PALETTES = {
        pyro: { light: 0xcfc6c0, shadow: 0x9c8f88, alpha: 0.6, mode: 0 },
        hydro: { light: 0xffffff, shadow: 0xcdeff5, alpha: 0.55, mode: 1 },
        cryo: { light: 0xf2fbff, shadow: 0xbfe4f7, alpha: 0.55, mode: 2 },
      };

      function spawnProceduralPuff(
        pos,
        type = "hydro",
        { baseSize = 1.0, lifeFrames = 40, riseStart = 0.8, riseEnd = 0.2, driftVel = null } = {},
      ) {
        const pal = PUFF_PALETTES[type] || PUFF_PALETTES.hydro;
        // 9 overlapping circles with tight radius variance (0.28–0.38) so it reads as one cohesive soft cloud
        const circles = [];
        for (let i = 0; i < 9; i++) {
          const a = (i / 9) * Math.PI * 2 + (Math.random() - 0.5) * 0.38;
          const dist = i === 0 ? 0.04 : 0.14 + Math.random() * 0.16;
          const r = 0.28 + Math.random() * 0.1;
          circles.push(new THREE.Vector3(Math.cos(a) * dist, Math.sin(a) * dist, r));
        }

        const mat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: {
            uCircles: { value: circles },
            uLightCol: { value: new THREE.Color(pal.light) },
            uShadowCol: { value: new THREE.Color(pal.shadow) },
            uBaseAlpha: { value: pal.alpha },
            uMode: { value: pal.mode },
            uDissolve: { value: 0.0 },
            uAlpha: { value: 0.0 },
            uRot: { value: Math.random() * Math.PI * 2 },
            uTime: { value: 0.0 },
            uSeed: { value: Math.random() * 31.4 },
          },
          vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
          fragmentShader: `
          uniform vec3 uCircles[9];
          uniform vec3 uLightCol;
          uniform vec3 uShadowCol;
          uniform float uBaseAlpha;
          uniform int uMode;
          uniform float uDissolve;
          uniform float uAlpha;
          uniform float uRot;
          uniform float uTime;
          uniform float uSeed;
          varying vec2 vUv;
          ${GLSL_NOISE}

          float puffSDF(vec2 p) {
            float d = 10.0;
            for (int i = 0; i < 9; i++) {
              d = min(d, length(p - uCircles[i].xy) - uCircles[i].z);
            }
            float n = (fbm3(p * 3.4 + vec2(uSeed, uTime * 0.35)) - 0.5) * 0.26;
            return d + n + uDissolve * 0.46;
          }

          void main() {
            vec2 p = vUv * 2.0 - 1.0;
            float cr = cos(uRot), sr = sin(uRot);
            vec2 pr = mat2(cr, -sr, sr, cr) * p;

            float d = puffSDF(pr);
            // Soft feathered edge (0.08 smoothstep), NO dark outline
            float edgeAlpha = smoothstep(0.08, -0.08, d);
            if (edgeAlpha < 0.01) discard;

            // 2-tone cel shading with close-value tones (no brown shadows)
            float eps = 0.035;
            vec2 grad = normalize(vec2(
              puffSDF(pr + vec2(eps, 0.0)) - puffSDF(pr - vec2(eps, 0.0)),
              puffSDF(pr + vec2(0.0, eps)) - puffSDF(pr - vec2(0.0, eps))
            ) + vec2(0.0001));
            float shadeSignal = p.y * 0.65 - grad.y * 0.35;
            float isLight = step(-0.28, shadeSignal);
            vec3 col = mix(uShadowCol, uLightCol, isLight);

            // Pyro orange underglow #FF7A2A at bottom 20% (alpha 0.35)
            if (uMode == 0) {
              float underMask = smoothstep(-0.30, -0.58, p.y);
              col += vec3(1.0, 0.478, 0.165) * 0.35 * underMask;
            }

            // Cryo: 6 subtle interior sparkle glints
            if (uMode == 2) {
              for (int i = 0; i < 6; i++) {
                vec2 dp = pr - uCircles[i].xy * 0.72;
                float glint = max(0.0, 1.0 - (abs(dp.x) * 28.0 + abs(dp.y) * 9.0))
                            + max(0.0, 1.0 - (abs(dp.y) * 28.0 + abs(dp.x) * 9.0));
                float tw = 0.5 + 0.5 * sin(uTime * 16.0 + float(i) * 2.1 + uSeed);
                col += vec3(0.95, 1.0, 1.0) * smoothstep(0.25, 0.9, glint) * tw * 0.75;
              }
            }

            gl_FragColor = vec4(col, edgeAlpha * uAlpha * uBaseAlpha);
          }
        `,
        });

        const mesh = new THREE.Mesh(SHARED.quad, mat);
        mesh.position.copy(pos);
        scene.add(mesh);
        const rotSpeed = THREE.MathUtils.degToRad(20) * (Math.random() > 0.5 ? 1 : -1);

        addEffect({
          age: 0,
          lifeFrames,
          particleCount: 1,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS;
            const fNorm = (f / this.lifeFrames) * 40; // Exact 40-frame spec timeline

            // F0 scale 0.5 -> F10 scale 1.2 -> F40 scale 2.0; erosion F20–F40
            let sc,
              al,
              diss = 0;
            if (fNorm <= 10) {
              const k = fNorm / 10;
              sc = THREE.MathUtils.lerp(0.5, 1.2, k);
              al = k;
            } else {
              const k = Math.min((fNorm - 10) / 30, 1);
              sc = THREE.MathUtils.lerp(1.2, 2.0, k);
              al = 1.0;
            }
            if (fNorm >= 20) {
              diss = Math.min((fNorm - 20) / 20, 1);
              al *= 1.0 - diss * 0.45;
            }
            mesh.scale.setScalar(sc * baseSize);

            const riseSpeed = THREE.MathUtils.lerp(riseStart, riseEnd, Math.min(f / this.lifeFrames, 1));
            mesh.position.y += riseSpeed * dt;
            if (driftVel) mesh.position.addScaledVector(driftVel, dt);

            mesh.lookAt(camera.position);
            mat.uniforms.uRot.value += rotSpeed * dt;
            mat.uniforms.uAlpha.value = al;
            mat.uniforms.uDissolve.value = diss;
            mat.uniforms.uTime.value = this.age;

            if (f >= this.lifeFrames) {
              scene.remove(mesh);
              mat.dispose();
              return false;
            }
            return true;
          },
        });
      }

      // =========================================================================
      // EFFECT A: CATALYST BASIC ATTACK (UNCHANGED EXCEPT PROCEDURAL PUFFS)
      // =========================================================================
      function triggerCatalystAttack() {

          age: 0,

            this.age += dt;
            const f = this.age * FPS;
            const t = Math.min(f / this.durationFrames, 1);
            const pop = t < 0.22 ? t / 0.22 : 1.0;
            sigil.scale.setScalar(0.3 + pop * 0.95);
            sigil.rotation.z += dt * 7.5;
            sigilMat.uniforms.uTime.value = this.age;
            sigilMat.uniforms.uAlpha.value = t < 0.22 ? pop : 1 - (t - 0.22) / 0.78;
            if (f >= this.durationFrames) {
              scene.remove(sigil);
              disposeObject(sigil);
              return false;
            }
            return true;
          },
        });

        const projGroup = new THREE.Group();
        projGroup.position.copy(startPos);
        const coreMesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.34, 16, 14),
          new THREE.MeshBasicMaterial({ color: pal.rim }),
        );
        const darkRimCore = new THREE.Mesh(
          new THREE.SphereGeometry(0.39, 16, 14),
          new THREE.MeshBasicMaterial({ color: pal.core, side: THREE.BackSide }),
        );
        const shellMat = createCelVfxMaterial({
          darkOutline: pal.dark,
          coreColor: pal.core,
          midColor: pal.mid,
          rimColor: pal.rim,
          scroll: [0.6, -3.5],
          noiseScale: [2.8, 2.8],
          fresnelPower: 1.9,
          opacity: 0.95,
          blending: THREE.AdditiveBlending,
          edgeSoftness: 0.02,
          emissiveBoost: 1.35,
        });
        const shellMesh = new THREE.Mesh(new THREE.SphereGeometry(0.62, 20, 16), shellMat);
        projGroup.add(coreMesh, darkRimCore, shellMesh);
        scene.add(projGroup);

        const trailSegs = 26;
        const makeRibbon = (phase) => {
          const posArr = new Float32Array(trailSegs * 2 * 3),
            uvArr = new Float32Array(trailSegs * 2 * 2),
            idx = [];
          for (let i = 0; i < trailSegs; i++) {
            const v = i / (trailSegs - 1);
            uvArr[i * 4] = 0;
            uvArr[i * 4 + 1] = v;
            uvArr[i * 4 + 2] = 1;
            uvArr[i * 4 + 3] = v;
            if (i < trailSegs - 1) {
              const a = i * 2;
              idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
            }
          }
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
          geo.setAttribute("uv", new THREE.BufferAttribute(uvArr, 2));
          geo.setIndex(idx);
          const mat = createCelVfxMaterial({
            darkOutline: pal.dark,
            coreColor: pal.core,
            midColor: pal.mid,
            rimColor: pal.rim,
            scroll: [0, -3.0],
            noiseScale: [1.4, 4.5],
            opacity: 0.92,
            blending: THREE.AdditiveBlending,
            edgeSoftness: 0.08,
            emissiveBoost: 1.3,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.frustumCulled = false;
          scene.add(mesh);
          return { geo, mat, mesh, phase };
        };
        const ribbons = [makeRibbon(0), makeRibbon(Math.PI)];
        const trailHistory = Array.from({ length: trailSegs }, () => startPos.clone());
        const sideSign = Math.random() > 0.5 ? 1 : -1;
        const ctrlPos = startPos
          .clone()
          .lerp(targetPos, 0.5)
          .add(new THREE.Vector3(sideSign * 1.45, 0.95, 0));
        let stormInfused = false,
          sparkAccum = 0;

        addEffect({
          age: 0,
          durationFrames: 27,
          particleCount: 4,
          isHero: true,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS;
            lastCastFrame = Math.floor(f);
            if (f < 4) {
              projGroup.scale.setScalar(0.35 + (f / 4) * 0.75);
              shellMat.uniforms.uTime.value = this.age;
              return true;
            }
            const t = Math.min((f - 4) / (this.durationFrames - 4), 1);
            const easeT = t < 0.4 ? 2.5 * t * t : 1 - Math.pow(1 - t, 2.2);
            const om = 1 - easeT;
            const p = new THREE.Vector3()
              .addScaledVector(startPos, om * om)
              .addScaledVector(ctrlPos, 2 * om * easeT)
              .addScaledVector(targetPos, easeT * easeT);
            projGroup.position.copy(p);
            projGroup.scale.setScalar(1.0 + Math.sin(t * Math.PI) * 0.18);
            shellMesh.rotation.y += dt * 9;
            shellMesh.rotation.x += dt * 6;
            shellMat.uniforms.uTime.value = this.age;

            sparkAccum += dt;
            if (sparkAccum > 0.045) {
              sparkAccum = 0;
              spawnFlipbookBillboard(p, sparkleFlipbook, {
                scaleStart: 0.45,
                scaleEnd: 0.9,
                duration: 0.22,
                tint: pal.rim,
                blending: THREE.AdditiveBlending,
                boost: 1.4,
              });
            }
            if (activeStorm && !stormInfused && p.distanceTo(activeStorm.center) < 3.6) {
              activeStorm.absorbElement(elemKey);
              stormInfused = true;
            }

            trailHistory.unshift(p.clone());
            trailHistory.pop();
            const camDir = new THREE.Vector3();
            for (const rb of ribbons) {
              rb.mat.uniforms.uTime.value = this.age;
              const posAttr = rb.geo.attributes.position;
              for (let i = 0; i < trailSegs; i++) {
                const cur = trailHistory[i],
                  nxt = trailHistory[Math.min(i + 1, trailSegs - 1)];
                const tan = cur.clone().sub(nxt);
                if (tan.lengthSq() < 1e-6) tan.set(0, 0, -1);
                tan.normalize();
                camDir.copy(camera.position).sub(cur).normalize();
                const side = new THREE.Vector3().crossVectors(tan, camDir).normalize();
                const up = new THREE.Vector3().crossVectors(side, tan).normalize();
                const frac = i / (trailSegs - 1);
                const spiralA = rb.phase + frac * Math.PI * 3.8 - this.age * 16.0;
                const spiralR = Math.sin(frac * Math.PI) * 0.36;
                const c = cur
                  .clone()
                  .addScaledVector(side, Math.cos(spiralA) * spiralR)
                  .addScaledVector(up, Math.sin(spiralA) * spiralR);
                const w = (1 - frac) * 0.36,
                  i6 = i * 6;
                posAttr.array[i6] = c.x + side.x * w;
                posAttr.array[i6 + 1] = c.y + side.y * w;
                posAttr.array[i6 + 2] = c.z + side.z * w;
                posAttr.array[i6 + 3] = c.x - side.x * w;
                posAttr.array[i6 + 4] = c.y - side.y * w;
                posAttr.array[i6 + 5] = c.z - side.z * w;
              }
              posAttr.needsUpdate = true;
            }
            if (f >= this.durationFrames) {
              scene.remove(projGroup);
              disposeObject(projGroup);
              for (const rb of ribbons) {
                scene.remove(rb.mesh);
                disposeObject(rb.mesh);
              }
              spawnCatalystImpact(targetPos, elemKey);
              return false;
            }
            return true;
          },
        });
      }

            cluster.add(sMesh);

        const decalMat = createRuneDecalMaterial(

        const decal = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 3.8), decalMat);

        addEffect({
          age: 0,

          update(dt) {

            ringMat.uniforms.uOpacity.value = (1 - rt) * 0.95;

            decalMat.uniforms.uTime.value = this.age;
            decalMat.uniforms.uAlpha.value = 1 - Math.pow(t, 1.8);

            if (f >= this.durationFrames) {
              scene.remove(ringMesh, decal);
              disposeObject(ringMesh);
              disposeObject(decal);

      // =========================================================================
      // FIX 2 — MAI LINH FIREWORKS (SHELL LAUNCH + VELOCITY STREAK QUADS + MAI SHELL #3 + CRACKLE)
      // =========================================================================
      /*
       * FRAME TABLE — MAI LINH FIREWORK SHELL (relative to shell launch, 60 fps):
       *   Launch stagger : 5 shells, shell i launches at lantern pop frame + i * 6 frames (i = 0..4)
       *   F0–F23  LAUNCH : Bright head (0.12 m, #FFF2B0) rises 2.0 m ease-out to burst height 3.6–4.6 m,
       *                    leaving 30 wiggling (+/-0.05 m) sparks (#FFB347 -> alpha 0 over 12 frames).
       *   F24     FLASH  : Additive disc 1.2 m (#FFE9A0, alpha 1->0 over 4F: F24–F28);
       *                    PointLight intensity 8 decaying over 12F (F24–F36); 2F hit-stop on shell #0 only.
       *   F24–F34 EXPAND : 140 velocity-streak quads (pos back to pos - vel*0.05s, width 0.035m, head alpha 1->tail 0),
       *                    uniform sphere speed 5–7 m/s, drag *0.90/frame -> radius ~2.2 m at F40.
       *                    SHELL #3 (i===2): 150 streaks in camera-facing plane along r(theta)=R*|cos(2.5*theta)|^0.6
       *                    (R=2.0m @ F40, #FFE35A -> #FF9A2E tips) + 20 gold center disc (r<=0.35m, #FFC531)
       *                    + 5 stamen lines (0.5m, #FF6A26). Readable 5-petal Mai flower F34–F55.
       *   F34–F75 DROOP  : Gravity -3 m/s^2 willow curve; color F24-34 #FFF6C8 -> F40 #FFD24A -> F55 #FF8A2A -> F70 #D83A1E;
       *                    alpha fades F55 -> 0 at F75.
       *   F45–F90 CRACKLE: 60 tiny white glitter points (#FFFFFF, 0.04 m) along drooping paths, blinking 2F on / 3F off.
       *   F30–F100 SMOKE : 3 procedural pyro smoke puffs (FIX 3) at burst point.
       */
      function spawnFireworkShell(launchOrigin, shellIndex, targetBurstHeight) {
        const isMaiShell = shellIndex === 2; // Shell #3 (1-indexed) -> bursts at 3.2m above lantern circle center (0, 3.2, -2.0)
        const riseHeight = 1.5;
        const bx = isMaiShell ? 0.0 : launchOrigin.x;
        const bz = isMaiShell ? -2.0 : launchOrigin.z;
        const startY = Math.max(1.0, targetBurstHeight - riseHeight);
        const startPos = new THREE.Vector3(launchOrigin.x, startY, launchOrigin.z);
        const burstPos = new THREE.Vector3(bx, targetBurstHeight, bz);

        // Launch head (0.12 m, #FFF2B0)
        const headMat = new THREE.MeshBasicMaterial({ color: 0xfff2b0 });
        const headMesh = new THREE.Mesh(SHARED.sphereLow, headMat);
        headMesh.scale.setScalar(0.06); // diameter 0.12m
        headMesh.position.copy(startPos);
        scene.add(headMesh);

        // Launch trail: 30 sparks (#FFB347 -> alpha 0 over 12 frames, wiggle +/-0.05m)
        const TRAIL_COUNT = 30;
        const tPos = new Float32Array(TRAIL_COUNT * 3);
        const tCol = new Float32Array(TRAIL_COUNT * 3);
        const tSize = new Float32Array(TRAIL_COUNT);
        const tAlpha = new Float32Array(TRAIL_COUNT);
        const cAmber = new THREE.Color(0xffb347);
        const trailData = [];
        for (let i = 0; i < TRAIL_COUNT; i++) {
          tCol[i * 3] = cAmber.r;
          tCol[i * 3 + 1] = cAmber.g;
          tCol[i * 3 + 2] = cAmber.b;
          tSize[i] = 0.065;
          tAlpha[i] = 0;
          trailData.push({
            bornF: -1,
            x: 0,
            y: 0,
            z: 0,
            wx: (Math.random() - 0.5) * 0.1,
            wz: (Math.random() - 0.5) * 0.1,
          });
        }
        const tGeo = new THREE.BufferGeometry();
        tGeo.setAttribute("position", new THREE.BufferAttribute(tPos, 3));
        tGeo.setAttribute("aColor", new THREE.BufferAttribute(tCol, 3));
        tGeo.setAttribute("aSize", new THREE.BufferAttribute(tSize, 1));
        tGeo.setAttribute("aAlpha", new THREE.BufferAttribute(tAlpha, 1));
        const tMat = createGpuSparkMaterial(THREE.AdditiveBlending, true);
        const tPts = new THREE.Points(tGeo, tMat);
        tPts.frustumCulled = false;
        scene.add(tPts);

        // F24 Flash disc (1.2 m, #FFE9A0, alpha 1->0 over 4F)
        const flashMat = new THREE.MeshBasicMaterial({
          color: 0xffe9a0,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const flashDisc = new THREE.Mesh(new THREE.CircleGeometry(0.6, 24), flashMat);
        flashDisc.position.copy(burstPos);
        flashDisc.visible = false;
        scene.add(flashDisc);

        // Velocity-aligned Streak Quads (single dynamic BufferGeometry, 1 draw call!)
        const STREAK_COUNT = isMaiShell ? 175 : 140; // Mai: 150 petals + 20 center disc + 5 stamens
        const sPos = new Float32Array(STREAK_COUNT * 4 * 3);
        const sCol = new Float32Array(STREAK_COUNT * 4 * 3);
        const sAlpha = new Float32Array(STREAK_COUNT * 4);
        const sIdx = [];
        for (let i = 0; i < STREAK_COUNT; i++) {
          const b = i * 4;
          sIdx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
        }
        const sGeo = new THREE.BufferGeometry();
        sGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
        sGeo.setAttribute("aColor", new THREE.BufferAttribute(sCol, 3));
        sGeo.setAttribute("aAlpha", new THREE.BufferAttribute(sAlpha, 1));
        sGeo.setIndex(sIdx);
        const sMat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          side: THREE.DoubleSide,
          vertexShader: `
          attribute vec3 aColor; attribute float aAlpha;
          varying vec3 vColor; varying float vAlpha;
          void main() {
            vColor = aColor; vAlpha = aAlpha;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
          fragmentShader: `
          varying vec3 vColor; varying float vAlpha;
          void main() {
            if (vAlpha < 0.01) discard;
            gl_FragColor = vec4(vColor, vAlpha);
          }
        `,
        });
        const streakMesh = new THREE.Mesh(sGeo, sMat);
        streakMesh.frustumCulled = false;
        streakMesh.visible = false;
        scene.add(streakMesh);

        // Crackle glitter (F45–F90): 60 white points, 0.04m, 2F on / 3F off
        const CRACKLE_COUNT = 60;
        const cPos = new Float32Array(CRACKLE_COUNT * 3);
        const cCol = new Float32Array(CRACKLE_COUNT * 3);
        const cSize = new Float32Array(CRACKLE_COUNT);
        const cAlpha = new Float32Array(CRACKLE_COUNT);
        const cracklePhase = new Int32Array(CRACKLE_COUNT);
        for (let i = 0; i < CRACKLE_COUNT; i++) {
          cCol[i * 3] = 1;
          cCol[i * 3 + 1] = 1;
          cCol[i * 3 + 2] = 1;
          cSize[i] = 0.04;
          cAlpha[i] = 0;
          cracklePhase[i] = Math.floor(Math.random() * 5);
        }
        const cGeo = new THREE.BufferGeometry();
        cGeo.setAttribute("position", new THREE.BufferAttribute(cPos, 3));
        cGeo.setAttribute("aColor", new THREE.BufferAttribute(cCol, 3));
        cGeo.setAttribute("aSize", new THREE.BufferAttribute(cSize, 1));
        cGeo.setAttribute("aAlpha", new THREE.BufferAttribute(cAlpha, 1));
        const cMat = createGpuSparkMaterial(THREE.AdditiveBlending, true);
        const cracklePts = new THREE.Points(cGeo, cMat);
        cracklePts.frustumCulled = false;
        cracklePts.visible = false;
        scene.add(cracklePts);

        // Streak particle state
        const streaks = [];
        let burstInit = false;
        let crackleInit = false;
        let smokeSpawned = false;
        let nextTrailIdx = 0;
        let lastTrailF = -1;

        const colWhiteGold = new THREE.Color(0xfff6c8);
        const colGold = new THREE.Color(0xffd24a);
        const colOrange = new THREE.Color(0xff8a2a);
        const colRed = new THREE.Color(0xd83a1e);
        const colMaiBase = new THREE.Color(0xffe35a);
        const colMaiTip = new THREE.Color(0xff9a2e);
        const colMaiCenter = new THREE.Color(0xffc531);
        const colMaiStamen = new THREE.Color(0xff6a26);
        const tmpCol = new THREE.Color();

        addEffect({
          age: 0,
          durationFrames: 102,
          particleCount: STREAK_COUNT + CRACKLE_COUNT,
          update(dt) {
            this.age += dt;
            const f = this.age * FPS;
            const fi = Math.floor(f);
            const steps = dt * FPS; // fractional frames (1.0 at 60fps)

            // F0–F23 LAUNCH
            if (f < 24) {
              const lt = f / 23;
              const easeOut = 1 - Math.pow(1 - lt, 2.2);
              const curX = THREE.MathUtils.lerp(startPos.x, burstPos.x, easeOut);
              const curY = startPos.y + riseHeight * easeOut;
              const curZ = THREE.MathUtils.lerp(startPos.z, burstPos.z, easeOut);
              headMesh.position.set(curX, curY, curZ);
              headMesh.visible = true;
              if (fi > lastTrailF) {
                lastTrailF = fi;
                const td = trailData[nextTrailIdx % TRAIL_COUNT];
                td.bornF = f;
                td.x = curX;
                td.y = curY;
                td.z = curZ;
                nextTrailIdx++;
              }
            } else {
              headMesh.visible = false;
            }

            // Update launch trail sparks (fade over 12F, wiggle +/-0.05m)
            const tp = tGeo.attributes.position,
              ta = tGeo.attributes.aAlpha;
            for (let i = 0; i < TRAIL_COUNT; i++) {
              const td = trailData[i];
              if (td.bornF < 0) continue;
              const ageF = f - td.bornF;
              if (ageF >= 12) {
                ta.array[i] = 0;
                continue;
              }
              const wig = Math.sin(ageF * 1.4 + i) * 0.05;
              tp.array[i * 3] = td.x + td.wx + wig;
              tp.array[i * 3 + 1] = td.y - ageF * 0.015;
              tp.array[i * 3 + 2] = td.z + td.wz;
              ta.array[i] = 1 - ageF / 12;
            }
            tp.needsUpdate = true;
            ta.needsUpdate = true;

            // F24 BURST INIT
            if (!burstInit && f >= 24) {
              burstInit = true;
              flashDisc.visible = true;
              streakMesh.visible = true;
              spawnFlashLight(burstPos, 0xffe9a0, 8.0, 12.0, 12);
              if (shellIndex === 0) {
                juice.triggerImpact(burstPos, { hitStopFrames: 2, shake: 0.22, shakeFrames: 10, refract: 0.028 });
              }

              // Camera-facing basis for Shell #3 (Mai blossom)
              const fwd = camera.position.clone().sub(burstPos).normalize();
              const right = new THREE.Vector3(0, 1, 0).cross(fwd).normalize();
              const up = fwd.clone().cross(right).normalize();
              // Drag factor 0.90/frame sum over 16 frames (F24->F40): sum(0.90^k)/60 ≈ 0.1358 s
              // So v0 = targetRadius / 0.1358 reaches exact targetRadius at F40!
              const dragIntegral = 0.136;

              for (let i = 0; i < STREAK_COUNT; i++) {
                if (isMaiShell) {
                  if (i < 150) {
                    // 5-petal Mai outline: r(theta) = 2.0 * |cos(2.5 * theta)|^0.6
                    const theta = (i / 150) * Math.PI * 2;
                    const petalFactor = Math.pow(Math.abs(Math.cos(2.5 * theta)), 0.6);
                    const rTarget = 2.0 * petalFactor;
                    const vMag = rTarget / dragIntegral;
                    const dir = new THREE.Vector3()
                      .addScaledVector(right, Math.cos(theta))
                      .addScaledVector(up, Math.sin(theta));
                    streaks.push({
                      pos: burstPos.clone(),
                      vel: dir.multiplyScalar(vMag),
                      kind: "maiPetal",
                      tipRatio: petalFactor,
                    });
                  } else if (i < 170) {
                    // 20 gold center disc streaks (r <= 0.35m, #FFC531)
                    const a = ((i - 150) / 20) * Math.PI * 2;
                    const rTarget = 0.12 + ((i % 4) / 3) * 0.23;
                    const dir = new THREE.Vector3()
                      .addScaledVector(right, Math.cos(a))
                      .addScaledVector(up, Math.sin(a));
                    streaks.push({
                      pos: burstPos.clone(),
                      vel: dir.multiplyScalar(rTarget / dragIntegral),
                      kind: "maiCenter",
                    });
                  } else {
                    // 5 short stamen lines (0.5 m, #FF6A26)
                    const k = i - 170;
                    const a = (k / 5) * Math.PI * 2;
                    const dir = new THREE.Vector3()
                      .addScaledVector(right, Math.cos(a))
                      .addScaledVector(up, Math.sin(a));
                    streaks.push({
                      pos: burstPos.clone(),
                      vel: dir.multiplyScalar(0.5 / dragIntegral),
                      kind: "maiStamen",
                    });
                  }
                } else {
                  // Uniform sphere: initial speed 5–7 m/s (reaches ~2.2 m at F40 with 0.90^f drag? Wait:
                  // 6 m/s * 0.136 = 0.82m; to honor BOTH "speed 5–7 m/s" AND "reaches radius ~2.2 m at F40",
                  // scale speed to ~14.5–17.5 m/s OR gentler drag 0.945 -> 6.2 m/s at 0.945 gives ~1.1m.
                  // Let's use 13.5–16.5 m/s with exact *0.90/frame drag so radius hits ~2.2m at F40 AND trails look crisp!)
                  const u = Math.random() * 2 - 1;
                  const phi = Math.random() * Math.PI * 2;
                  const sq = Math.sqrt(1 - u * u);
                  const spd = 14.0 + Math.random() * 4.0;
                  streaks.push({
                    pos: burstPos.clone(),
                    vel: new THREE.Vector3(sq * Math.cos(phi) * spd, u * spd, sq * Math.sin(phi) * spd),
                    kind: "sphere",
                  });
                }
              }
            }

            // F24–F28 Flash disc fade over 4 frames
            if (f >= 24 && f <= 28) {
              flashDisc.visible = true;
              flashDisc.lookAt(camera.position);
              flashMat.opacity = Math.max(0, 1 - (f - 24) / 4);
            } else {
              flashDisc.visible = false;
            }

            // F30–F100 Smoke: 3 procedural pyro smoke puffs at burst point
            if (!smokeSpawned && f >= 30) {
              smokeSpawned = true;
              for (let k = 0; k < 3; k++) {
                const a = (k / 3) * Math.PI * 2;
                spawnProceduralPuff(
                  burstPos.clone().add(new THREE.Vector3(Math.cos(a) * 0.45, (k - 1) * 0.25, Math.sin(a) * 0.45)),
                  "pyro",
                  { baseSize: 1.1, lifeFrames: 40, riseStart: 0.55, riseEnd: 0.15 },
                );
              }
            }

            // F24–F75 Streak physics & quad geometry update
            if (burstInit && f <= 76) {
              const dragFactor = Math.pow(0.9, steps);
              const posAttr = sGeo.attributes.position;
              const colAttr = sGeo.attributes.aColor;
              const alpAttr = sGeo.attributes.aAlpha;
              const halfW = 0.0175; // width 0.035m
              const headAlpha = f < 55 ? 1.0 : Math.max(0, 1 - (f - 55) / 20);
              const camDir = new THREE.Vector3();
              const side = new THREE.Vector3();
              const tailPos = new THREE.Vector3();

              // Standard shell color ramp
              if (f <= 34) tmpCol.copy(colWhiteGold);
              else if (f <= 40) tmpCol.copy(colWhiteGold).lerp(colGold, (f - 34) / 6);
              else if (f <= 55) tmpCol.copy(colGold).lerp(colOrange, (f - 40) / 15);
              else tmpCol.copy(colOrange).lerp(colRed, Math.min(1, (f - 55) / 15));

              for (let i = 0; i < STREAK_COUNT; i++) {
                const st = streaks[i];
                // Drag *0.90/frame during expansion & droop; gravity -3 m/s^2 from F34
                st.vel.multiplyScalar(dragFactor);
                if (f >= 34) {
                  const gScale = isMaiShell ? (f < 55 ? -0.45 : -3.0) : -3.0; // Keep Mai flower crisp F34-F55
                  st.vel.y += gScale * dt;
                }
                st.pos.addScaledVector(st.vel, dt);

                // Streak quad from pos back to pos - vel * 0.05s (min visible length for readable Mai shape)
                const streakScale = isMaiShell ? Math.max(0.055, 0.16 / Math.max(0.4, st.vel.length())) : 0.05;
                tailPos.copy(st.pos).addScaledVector(st.vel, -streakScale);
                const dir = st.pos.clone().sub(tailPos);
                if (dir.lengthSq() < 1e-6) dir.set(0, 0.08, 0);
                camDir.copy(camera.position).sub(st.pos).normalize();
                side.crossVectors(dir, camDir).normalize().multiplyScalar(halfW);

                const v0 = i * 12;
                // Head vertices (alpha = headAlpha)
                posAttr.array[v0 + 0] = st.pos.x + side.x;
                posAttr.array[v0 + 1] = st.pos.y + side.y;
                posAttr.array[v0 + 2] = st.pos.z + side.z;
                posAttr.array[v0 + 3] = st.pos.x - side.x;
                posAttr.array[v0 + 4] = st.pos.y - side.y;
                posAttr.array[v0 + 5] = st.pos.z - side.z;
                // Tail vertices (alpha = 0)
                posAttr.array[v0 + 6] = tailPos.x + side.x;
                posAttr.array[v0 + 7] = tailPos.y + side.y;
                posAttr.array[v0 + 8] = tailPos.z + side.z;
                posAttr.array[v0 + 9] = tailPos.x - side.x;
                posAttr.array[v0 + 10] = tailPos.y - side.y;
                posAttr.array[v0 + 11] = tailPos.z - side.z;

                let c = tmpCol;
                if (st.kind === "maiPetal") c = colMaiBase.clone().lerp(colMaiTip, st.tipRatio);
                else if (st.kind === "maiCenter") c = colMaiCenter;
                else if (st.kind === "maiStamen") c = colMaiStamen;

                for (let k = 0; k < 4; k++) {
                  const ci = (i * 4 + k) * 3;
                  colAttr.array[ci] = c.r;
                  colAttr.array[ci + 1] = c.g;
                  colAttr.array[ci + 2] = c.b;
                }
                const ai = i * 4;
                alpAttr.array[ai] = headAlpha;
                alpAttr.array[ai + 1] = headAlpha;
                alpAttr.array[ai + 2] = 0;
                alpAttr.array[ai + 3] = 0;
              }
              posAttr.needsUpdate = true;
              colAttr.needsUpdate = true;
              alpAttr.needsUpdate = true;
            } else if (f > 76) {
              streakMesh.visible = false;
            }

            // F45–F90 CRACKLE: 60 white glitter points, 2F on / 3F off
            if (f >= 45 && f <= 90 && burstInit) {
              if (!crackleInit) {
                crackleInit = true;
                cracklePts.visible = true;
                const cp = cGeo.attributes.position;
                for (let i = 0; i < CRACKLE_COUNT; i++) {
                  const src = streaks[Math.floor((i / CRACKLE_COUNT) * streaks.length)];
                  cp.array[i * 3] = src.pos.x + (Math.random() - 0.5) * 0.22;
                  cp.array[i * 3 + 1] = src.pos.y + (Math.random() - 0.5) * 0.22;
                  cp.array[i * 3 + 2] = src.pos.z + (Math.random() - 0.5) * 0.22;
                }
                cp.needsUpdate = true;
              }
              const cp = cGeo.attributes.position,
                ca = cGeo.attributes.aAlpha;
              for (let i = 0; i < CRACKLE_COUNT; i++) {
                cp.array[i * 3 + 1] -= 0.35 * dt;
                const cycle = (fi + cracklePhase[i]) % 5; // 2F on (0,1), 3F off (2,3,4)
                ca.array[i] = cycle < 2 ? 1 - Math.max(0, (f - 78) / 12) : 0;
              }
              cp.needsUpdate = true;
              ca.needsUpdate = true;
            } else {
              cracklePts.visible = false;
            }

            if (f >= this.durationFrames) {
              scene.remove(headMesh, tPts, flashDisc, streakMesh, cracklePts);
              headMat.dispose();
              tGeo.dispose();
              tMat.dispose();
              flashDisc.geometry.dispose();
              flashMat.dispose();
              sGeo.dispose();
              sMat.dispose();
              cGeo.dispose();
              cMat.dispose();
              return false;
            }
            return true;
          },
        });
      }

      function createDetailedLantern(scale = 1.0) {
        const g = new THREE.Group();
        const bodyGeo = new THREE.SphereGeometry(0.56, 20, 14);
        bodyGeo.scale(1.0, 0.88, 1.0);
        const bodyMat = createCelVfxMaterial({
          darkOutline: 0x450504,
          coreColor: 0xffd85c,
          midColor: 0xe82622,
          rimColor: 0x8f0d0c,
          scroll: [0.0, -0.35],
          noiseScale: [4.0, 2.0],
          fresnelPower: 1.6,
          opacity: 0.96,
          blending: THREE.NormalBlending,
          edgeSoftness: 0.0,
          emissiveBoost: 1.15,
        });
        g.add(new THREE.Mesh(bodyGeo, bodyMat));
        const ribMat = new THREE.MeshToonMaterial({ color: 0x4a0808 });
        for (let i = 0; i < 8; i++) {
          const rib = new THREE.Mesh(new THREE.TorusGeometry(0.555, 0.015, 5, 22), ribMat);
          rib.scale.set(1.0, 0.88, 1.0);
          rib.rotation.y = (i / 8) * Math.PI;
