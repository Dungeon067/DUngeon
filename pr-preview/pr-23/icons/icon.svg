<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Biểu tượng Tinh Tú Ước Nguyện (S22): sao bốn cánh giữa chòm sao, vẽ tay cho dự án. Nội dung chính nằm trong vùng an toàn 80% để dùng làm icon maskable. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#2a2f6e"/>
      <stop offset="0.55" stop-color="#151a42"/>
      <stop offset="1" stop-color="#0a0e26"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#f0c060" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0c060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#f6cf6a"/>
      <stop offset="1" stop-color="#c8902d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- vòng quỹ đạo mờ -->
  <ellipse cx="256" cy="262" rx="176" ry="58" fill="none" stroke="#ad8cf5" stroke-opacity="0.35" stroke-width="5" transform="rotate(-18 256 262)"/>
  <!-- chòm sao: đường nối -->
  <g stroke="#a6c8ff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M112 150 L168 118 L226 152"/>
    <path d="M300 368 L352 398 L404 356"/>
    <path d="M404 356 L392 290"/>
    <path d="M112 150 L98 214"/>
  </g>
  <!-- chòm sao: các sao nhỏ -->
  <g fill="#e6efff">
    <circle cx="112" cy="150" r="7"/>
    <circle cx="168" cy="118" r="9"/>
    <circle cx="226" cy="152" r="5"/>
    <circle cx="98" cy="214" r="5"/>
    <circle cx="300" cy="368" r="5"/>
    <circle cx="352" cy="398" r="8"/>
    <circle cx="404" cy="356" r="7"/>
    <circle cx="392" cy="290" r="5"/>
    <circle cx="380" cy="132" r="3.5" fill-opacity="0.8"/>
    <circle cx="140" cy="372" r="3.5" fill-opacity="0.8"/>
    <circle cx="420" cy="196" r="3" fill-opacity="0.7"/>
    <circle cx="190" cy="420" r="3" fill-opacity="0.7"/>
  </g>
  <!-- sao chính -->
  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>
  <path d="M256 104 C266 206 290 238 384 256 C290 274 266 306 256 408 C246 306 222 274 128 256 C222 238 246 206 256 104 Z" fill="url(#gold)" stroke="#fff6d8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M256 196 C259 236 268 248 304 256 C268 264 259 276 256 316 C253 276 244 264 208 256 C244 248 253 236 256 196 Z" fill="#fffbea"/>
</svg>
