    thoai:
      - { ai: Bà Ngoan, loi: "Chết thôi, thùng dầu đèn đổ ra đường mà bén lửa rồi." }
      - { ai: Bà Ngoan, loi: "Giấy dán đèn của bà để cả ở bên kia." }
      - { ai: Sương Mai, loi: "Bà đừng lo. Lửa dầu thì phải dập từng đám." }
      - { ai: Bà Ngoan, loi: "Cảm ơn cháu. Tết này hàng đèn vẫn sáng." }
