    vung: Trại Bắc
    moTa: Mây núi đọng che kín một bức tường nứt sau Trại Bắc. Sau tường là kho gạo cũ của Quân Trấn Thủ.
    thoai:
      - { ai: Cai Tôn, loi: "Sau trại có bức tường nứt, sau tường là kho gạo cũ." }
      - { ai: Cai Tôn, loi: "Mây núi đọng ở đó quanh năm, lính không nhìn thấy đường đập." }
      - { ai: Bạch Vũ, loi: "Tôi thổi mây. Còn tường thì cần người dùng đất." }
      - { ai: Cai Tôn, loi: "Lấy được gạo thì trại chia cho làng một nửa." }
