    vung: Hồ Gương và Đền Trăng
    moTa: Bệ đá cúng trăng chìm xuống bùn. Theo sách cũ, hơi nước nóng dưới bồn sẽ nâng bệ lên.
    thoai:
      - { ai: Bà Cả Thu Vọng, loi: "Bệ cúng trăng chìm xuống bùn đã ba mùa." }
      - { ai: Bà Cả Thu Vọng, loi: "Sách cũ chép rằng nước gặp lửa thành hơi, hơi nâng được đá." }
      - { ai: Sương Mai, loi: "Cháu đổ nước, Mai Linh nhóm lửa." }
      - { ai: Mai Linh, loi: "Nước trước, lửa sau. Ngược lại thì chỉ có khói." }
      - { ai: Bà Cả Thu Vọng, loi: "Đúng như sách. Các cháu đọc sách nhiều hơn ta tưởng." }
