  - id: mq-cau-gay
    ten: Cầu Gãy Sông Sương
    npc: Ông Sáo
    vung: Bến Sông Sương
    moTa: Nước lũ đánh gãy hai nhịp cầu đá. Đò của Ông Sáo không chở xuể người qua sông.
    thoai:
      - { ai: Ông Sáo, loi: "Lũ tháng trước đánh gãy hai nhịp cầu đá." }
      - { ai: Ông Sáo, loi: "Đò tôi chở mỗi lần sáu người. Cả làng thì chở đến tối." }
      - { ai: Người Ước Nguyện, loi: "Đá thì phải có người dùng được sức đất." }
      - { ai: Ông Sáo, loi: "Vá xong cầu, tôi thổi cho các cậu một bài." }
