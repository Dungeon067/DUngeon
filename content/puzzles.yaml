    thoai:
      - { ai: Lão Neo, loi: "Sương ở bãi đá này không phải sương thường." }
      - { ai: Lão Neo, loi: "Hít vào là chóng mặt. Thằng Út về nằm ba hôm." }
      - { ai: Bạch Vũ, loi: "Để tôi thổi đi. Gió ngoài khơi đủ mạnh." }
