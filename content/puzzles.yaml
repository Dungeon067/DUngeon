  - id: mq-ha-vy
    ten: Sương Giá Bờ Hồ
    npc: Bà Tám Lụa
    vung: Hồ Gương và Đền Trăng
    moTa: Hạ Vy luyện cung ở bờ đông Hồ Gương, băng của chính cô vây kín lối ra. Phá băng thì cô nhập đội (nguồn Băng miễn phí).
    thoai:
      - { ai: Bà Tám Lụa, loi: "Cháu có thấy con gái tôi không? Con bé tên Hạ Vy, sáng nay ra hồ tập bắn." }
      - { ai: Bà Tám Lụa, loi: "Mùa hè mà nó cứ đi đến đâu là sương giá theo đến đó." }
      - { ai: Mai Linh, loi: "Bờ đông hồ đang đóng băng kìa. Để cháu làm tan." }
      - { ai: Hạ Vy, loi: "Con xin lỗi mẹ. Con tập mạnh tay quá, băng vây cả lối về." }
      - { ai: Hạ Vy, loi: "Cho em đi cùng anh chị nhé. Băng của em dùng được việc khác ngoài việc tự nhốt mình." }
    cauDo: [bang-bo-ho]
    thuong: { daSao: 10, xu: 1000 }
    tang: havy
