    thoai:
      - { ai: Bé Sen, loi: "Lối hái nấm của em bị gai mọc kín rồi." }
      - { ai: Bé Sen, loi: "Bà Tư bảo đừng chui qua, gai cào rách áo." }
      - { ai: Mai Linh, loi: "Gai khô thì đốt là sạch. Em đứng lùi ra nhé." }
