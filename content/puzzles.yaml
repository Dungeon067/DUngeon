  - id: mq-gio-lan
    ten: Gió Lan Lửa Đình
    npc: Thầy Đồ Khiêm
    vung: Đình Trống Đồng
    moTa: Dãy năm đèn lồng trước cổng Đình phải sáng cùng lúc trước giờ đánh trống.
    thoai:
      - { ai: Thầy Đồ Khiêm, loi: "Năm đèn lồng trước cổng Đình phải sáng trước giờ đánh trống." }
      - { ai: Thầy Đồ Khiêm, loi: "Người xưa thắp một đèn, rồi chờ gió nồm thổi lửa sang đèn bên." }
      - { ai: Bạch Vũ, loi: "Gió nồm hôm nay không về. Nhưng tôi thì có." }
      - { ai: Thầy Đồ Khiêm, loi: "Hay. Ta viết được thêm một vế đối rồi." }
