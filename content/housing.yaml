# Hộ Tinh tới thăm: tối đa số người, mỗi ngày nói chuyện được một lần với mỗi người, cộng Thân thiết.
khach: { toiDa: 3, thanThiet: 30 }
loiKhach:
  - Nhà cậu thơm mùi gỗ mới. Tôi ngồi đây một lát nhé.
  - Đèn này ai làm vậy? Đẹp ghê.
  - Ở đây yên quá. Ngoài kia lúc nào cũng có tiếng trống.
  - Cậu đặt cái ghế này lệch rồi. Thôi, lệch cũng dễ thương.
  - Lần sau tôi mang bánh trống tới. Nhớ pha trà nhé.
  - Đêm nay trời nhiều sao. Cậu có nhớ ngôi nào là của mình không?
