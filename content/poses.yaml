# S27: dáng (archetype) dùng chung cho mọi nhân vật. Lớp chỉnh cộng (additive) lên bộ clip gốc theo vũ khí,
# áp lúc chạy trong src/render3d/toon/pose-layer.ts. Đơn vị: góc là độ, khoảng cách theo chiều cao hông (H).
# Ràng buộc nội dung: mọi tư thế trang nhã, không nhấn vào cơ thể (schema giới hạn biên độ nghiêng hông/vai);
# dáng trẻ em (tre: true) chỉ dùng tư thế hồn nhiên: không nghiêng hông, không đặt tay trước người.
#  dung: đứng yên ngoài trận   chan: nới (+) / khép (−) mỗi bàn chân theo chiều ngang
#        hong / vai: nghiêng hông / vai (vai ngược chiều hông)   lung: ngả lưng (+ cúi, − thẳng)   dau: nghiêng đầu
#        tay: mo = dang cánh tay khỏi người, gap = gập khuỷu, truoc = đưa hai tay khép nhẹ trước người (0..1)
#        tho: nhịp thở (lần/giây), bien = biên độ (độ)   doiTrong: nhịp + biên độ dồn trọng tâm
#  cho:  thế chờ trong trận: chan (nới thêm), ha (hạ hông), cui (đổ người tới trước), nhun + nhipNhun (nhún)
#  chay: bien = biên độ sải, nhip = nhịp bước (nhân tốc độ clip), nay = độ nảy
#  don:  nang 0..1: đòn nặng thì hạ hông và xoay thân nhiều hơn
#  tiLe: chỉ dùng cho bảng so sánh khi chưa có mô hình riêng (co giãn chiều cao / bề ngang).
