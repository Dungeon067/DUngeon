# S27: dáng (archetype) dùng chung cho mọi nhân vật. Lớp chỉnh cộng (additive) lên bộ clip gốc theo vũ khí,
# áp lúc chạy trong src/render3d/toon/pose-layer.ts. Đơn vị: góc là độ, khoảng cách theo chiều cao hông (H).
# Ràng buộc nội dung: mọi tư thế trang nhã, không nhấn vào cơ thể (schema giới hạn biên độ nghiêng hông/vai);
# dáng trẻ em (tre: true) chỉ dùng tư thế hồn nhiên: không nghiêng hông, không đặt tay trước người.
#  dung: đứng yên ngoài trận   chan: nới (+) / khép (−) mỗi bàn chân theo chiều ngang
#        hong / vai: nghiêng hông / vai (vai ngược chiều hông)   lung: ngả lưng (+ cúi, − thẳng)   dau: nghiêng đầu
#        moVai: mở vai ra sau   dauCui: cúi (+) / ngẩng (−) đầu
#        tay: mo = dang cánh tay khỏi người, gap = gập khuỷu, truoc = đưa hai tay khép nhẹ trước người (0..1),
#             dua = tay đung đưa nhẹ khi đứng (độ, dáng trẻ em)
#        tho: nhịp thở (lần/giây), bien = biên độ (độ)   doiTrong: nhịp + biên độ dồn trọng tâm
#  cho:  thế chờ trong trận: chan (nới thêm), ha (hạ hông), cui (đổ người tới trước), nhun + nhipNhun (nhún)
#  chay: bien = biên độ sải, nhip = nhịp bước (nhân tốc độ clip), nay = độ nảy, mo = tay xa thân khi chạy (độ)
#        nghieng: đổ người thêm từ hông (độ), cộng vào clip gốc đã thẳng lưng (chạy 10°, chạy nhanh 15°; chạy nhanh nhân 1,5), lac: nghiêng vào khúc cua tối đa (độ)
#  nghi: hoạt ảnh chờ ngẫu nhiên sau `sau` giây đứng yên tay không (dáng trẻ em: nhún nhảy hồn nhiên)
#  dung.tru: dồn trọng tâm một chân (0..1), chanTruoc: chân không trụ đặt trước (H), xoay: mở mũi chân (độ), tay.sau: chắp tay sau lưng
#  don:  nang 0..1: đòn nặng thì hạ hông và xoay thân nhiều hơn
#  tiLe: chỉ dùng cho bảng so sánh khi chưa có mô hình riêng (co giãn chiều cao / bề ngang).
# Vũ khí ngoài trận: thôi đánh / rời trận `cho` giây thì cất (clip `clip` nếu đứng yên, vũ khí chuyển tới chỗ `noi`),
# giữ `giu` giây rồi tan thành hạt sáng theo nguyên tố trong `tan` giây. Đánh thường / kỹ năng / nộ: hiện lại trong tay
# ngay khung đầu (tụ hạt `hien` giây, không làm chậm đòn). gan: khoảng cách quái (px logic) được tính là đang trong trận.
# Cất luôn đi LÊN và ra sau lưng theo quỹ đạo vòng cung 0,25 giây (weapon-fx.ts), không hạ thấp.
# noi: xương VRM chuẩn hóa, pos (m, hệ xương ở tư thế chữ T: +X trái, +Y lên, +Z trước), rot (độ, XYZ).
vuKhi:
  cho: 2.5
  gan: 420
  giu: 0.35
  tan: 0.6
  hien: 0.14
  hat: { so: 48, coDo: 0.05, bay: 0.5 }
  noi:
    # Kiếm: tra vào bao bên hông trái (clip cất mocap), rút từ hông rồi xoay một vòng cổ tay.
    sword:
      {
        bone: hips,
        pos: [0.17, 0.02, 0.02],
        rot: [0, 0, 110],
        clip: swStow,
        luc: 0.62,
        rut: swDraw,
        xoay: [0.55, 0.9, 1],
        truc: z,
      }
    # Đại kiếm: tay phải vung qua vai đặt chéo sau lưng; rút từ lưng kéo vòng qua đầu rồi vác vai.
    great: { bone: upperChest, pos: [-0.12, 0.12, -0.15], rot: [0, 0, -150], clip: grStow, luc: 0.85, rut: grDraw }
    # Thương: quay hai vòng trước người khi rút; cất thì vung qua vai đeo chéo lưng, mũi lên.
    spear:
      {
        bone: upperChest,
        pos: [-0.05, 0.0, -0.15],
        rot: [0, 0, 35],
        clip: spStow,
        luc: 0.85,
        rut: spDraw,
        xoay: [0.15, 0.8, 2],
        truc: x,
      }
    bow: { bone: upperChest, pos: [0.04, 0.0, -0.13], rot: [0, 0, 150], clip: bwStow, luc: 0.7, rut: bwDraw }
    # Sách gập lại, bay lên lơ lửng sau hông phải (ngang thắt lưng), lắc nhẹ, giu giây sau mới tan.
    cat: { bone: hips, pos: [-0.17, 0.16, -0.17], rot: [15, -30, -12], luc: 0, giu: 1.4, rut: ctDraw }
# Gió (spring bone tóc, vải) ở runtime: src/render3d/toon/wind.ts + cloth.ts. Hướng: độ, 0 = thổi về +X thế giới, 90 = về +Z.
#  vung: gió nền theo vùng (id trong content/terrain.yaml; mac-dinh cho vùng không khai báo), luc ~ độ cứng spring bone
#  thoiTiet: hệ số nhân theo thời tiết (khi game có thời tiết)   doCao: lên cao hơn `tu` m thì cộng moiM mỗi m, tối đa toiDa (đỉnh núi)
#  nhieu: gió giật (bien: ±tỉ lệ lực, goc: ±độ lệch hướng, nhip: lần/giây)   mieng: miệng gió `luongGio` (S23) đã mở: đẩy vải lên
#  xung: xung gió từ chiêu hệ Phong (khóa = loại field / sự kiện): luc, banKinh (m), song (giây), len (đẩy lên), xoay (thành phần xoáy)
#  trongSo: hệ số gió theo loại vải (tóc, dải / tua rua, áo choàng, tay áo, váy và vạt áo, ngực luôn 0, khác)
#  gioiHan: góc lệch tối đa so với tư thế nghỉ (độ): goc = khớp gốc, con = mỗi khớp sau, tong = cả chuỗi. Luôn áp dụng.
