# Túi đồ (S10). Mô tả câu chuyện lấy từ docs/world/08-vat-pham-va-di-vat.md (S01).
# type: một khóa trong types. rarity: 3–5. profileKey: số lượng đọc từ hồ sơ (ví dụ books) thay vì túi.
# drops: rương và quái có thể rơi vật phẩm; chance là xác suất mỗi lần, pool là danh sách id.
# Chưa có cơ chế dùng vật phẩm; vật phẩm chỉ để sưu tầm và đọc chuyện.
