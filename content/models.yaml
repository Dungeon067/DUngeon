# S25: mô hình 3D cho renderer toon. Đơn vị: 1 = một ô bản đồ (40 px).
# Thả file vào public/media/models/<id>/model.vrm là game tự nhận, không phải sửa code.
# Nhân vật chưa có file thì dùng mẫu tạm `mau`. Mục `nhanVat` chỉ để chỉnh riêng từng người
# (height, yOffset, dang = dáng người cho hệ tư thế S27: nu-teen, nu-nho, nam-teen...;
# vuKhi = GLB vũ khí hiển thị riêng khi chưa trang bị, thay cho vuKhiMacDinh; camVuKhi chỉ áp cho vuKhi đó).
mau: _mau
macDinh:
  height: 1.6 # chiều cao hiển thị
  yOffset: 0 # nâng hoặc hạ chân
# Vũ khí hiển thị theo loại khi nhân vật chưa trang bị (GLB xuất từ mô hình Blender của S24).
vuKhiMacDinh:
  sword: kiem-sat-lu-khach
  great: dai-kiem-xom-mo
  spear: thuong-go-lim
  bow: cung-tre-dau-lang
  cat: vo-chep-thay-do
# Cách cầm vũ khí: xương VRM chuẩn hóa, độ lệch trong hệ bàn tay (m), góc xoay (độ), tỉ lệ, điểm cầm dọc thân vũ khí (at).
camVuKhi:
  # Kiếm: một tay, cán vuông góc nắm tay.
  sword: { bone: rightHand, pos: [-0.08, -0.012, 0.005], rot: [90, 0, 0], scale: 0.75, at: -0.17 }
  # Đại kiếm: hai tay trên chuôi, tay trái ngay dưới tay phải.
  great:
    {
      bone: rightHand,
      pos: [-0.08, -0.012, 0.005],
      rot: [90, 0, 0],
      scale: 0.85,
      at: -0.12,
      tay2: { at: -0.25, rot: [0, 0, 180], chi: act },
    }
  # Thương: hai tay, nắm gần cuối cán, cán chéo dọc theo cẳng tay phải, mũi hướng lên trước; tay trái đỡ phía trước.
  spear: {
      bone: rightHand,
      pos: [-0.08, -0.02, 0.0],
      rot: [90, 0, -35],
      scale: 0.9,
      at: -0.95,
      tay2: { at: -0.45, rot: [0, 0, 180], chi: act },
      # Lúc chờ: một tay nắm giữa cán, cán dọc người, mũi chếch lên.
      cho: { pos: [-0.08, -0.012, 0.005], rot: [90, 0, 0], at: -0.3 },
    }
  # Cung: tay trái nắm giữa thân cung, cung dựng, dây quay về phía người.
  bow: { bone: leftHand, pos: [0.08, -0.012, 0.005], rot: [90, 0, 0], scale: 0.72, at: 0 }
  # Sách phép: không cầm, lơ lửng mở trang trước tay trái (rot: hướng sách theo thân người).
  cat: { bone: leftHand, pos: [0.02, 0.06, 0.22], rot: [-75, 0, 0], scale: 0.6, at: 0 }
# S26: vải và tóc có spring bone. gocMax = góc lệch tối đa (độ) của mỗi khớp so với tư thế nghỉ, luôn áp dụng
# kể cả khi gió mạnh nhất; gio = trọng số gió (0..1) cho hệ lực gió runtime S27 (tóc, dải vải cao, váy thấp).
# xuong: [regex tên xương, loại], lấy luật khớp đầu tiên. nhanVat/npc.<id>.vai ghi đè riêng (ưu tiên trước).
vai:
  loai:
    vay: { gocMax: 50, gio: 0.3 } # váy: không lật quá hông, bên trong luôn có quần bó tối
    vat: { gocMax: 50, gio: 0.35 } # vạt áo khoác trước, sau, hông
    tayAo: { gocMax: 60, gio: 0.5 }
    aoChoang: { gocMax: 75, gio: 0.8 } # áo choàng: không có rủi ro lộ, bay mạnh hơn
    daiVai: { gocMax: 90, gio: 1 } # dải vải, tua rua, dây
    toc: { gocMax: 80, gio: 0.9 }
    nguc: { gocMax: 15, gio: 0 }
  xuong:
    - [Bust, nguc]
    - [CoatSkirt, vat]
    - [Skirt, vay]
    - [Sleeve, tayAo]
    - [String|Sash|Ribbon|Tassel, daiVai]
    - [Hood|Cape|Mantle, aoChoang]
    - [Hair, toc]
  macDinh: vat
# Clip hoạt ảnh theo loại vũ khí (tên clip trong public/media/anim/humanoid.json, xem tools/anim/recipes.ts).
hoatAnh:
  sword:
    {
      stand: swReady,
      ready: swReady,
      move: { walk: swWalk, run: swRun, sprint: swSprint, stop: swStop },
      atk: [sw1, sw2, sw3],
      charge: swReady,
      skill: swSkill,
      burst: swBurst,
      speed: 1,
    }
  great:
    {
      stand: grReady,
      ready: grReady,
      move: { walk: grWalk, run: grRun, sprint: grSprint, stop: grStop },
      atk: [gr1, gr2, gr3],
      charge: grReady,
      skill: grSkill,
      burst: grBurst,
      speed: 0.75,
    }
  spear:
    {
      stand: spReady,
      ready: spReady,
      move: { walk: spWalk, run: spRun, sprint: spSprint, stop: spStop },
      atk: [sp1, sp2, sp3],
      charge: spReady,
      skill: spSkill,
      burst: spBurst,
      speed: 1,
    }
  bow:
    {
      stand: bowReady,
      ready: bowReady,
      move: { walk: bowWalk, run: bowRun, sprint: bowSprint, stop: bowStop },
      atk: [bow1, bow2, bow3],
      charge: bowAim,
      skill: bowSkill,
      burst: bowBurst,
      speed: 1,
    }
  cat:
    { stand: ctReady, ready: ctReady, atk: [ct1, ct2, ct3], charge: ctCharge, skill: ctSkill, burst: ctBurst, speed: 1 }
nhanVat:
  havy: { height: 1.55, dang: nu-teen }
  suongmai: { height: 1.56, dang: nu-teen }
  mailinh: { height: 1.4, dang: nu-nho, vuKhi: den-long-hoa-mai, camVuKhi: { rot: [0, 0, -90] } }
  bachvu: { height: 1.72, dang: nam-teen, vai: { CoatSkirt: aoChoang } } # vạt = áo choàng lông vũ, có quần dài
# Bộ NPC (S26): dựng từ bản đầu của đội khởi đầu, đổi tên và màu. File: public/media/models/npc/<id>/model.vrm.
# tu = mô hình gốc. Không dùng làm nhân vật chơi được.
npc:
  lamchi: { ten: Lam Chi, height: 1.55, dang: nu-teen, tu: havy }
  thuha: { ten: Thu Hà, height: 1.56, dang: nu-teen, tu: suongmai }
  bena: { ten: Bé Na, height: 1.4, dang: nu-nho, tu: mailinh }
  khai: { ten: Khải, height: 1.72, dang: nam-teen, tu: bachvu, vai: { CoatSkirt: aoChoang } }
