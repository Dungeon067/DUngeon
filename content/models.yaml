# S25: mô hình 3D cho renderer toon. Đơn vị: 1 = một ô bản đồ (40 px).
# Thả file vào public/media/models/<id>/model.vrm là game tự nhận, không phải sửa code.
# Nhân vật chưa có file thì dùng mẫu tạm `mau`. Mục `nhanVat` chỉ để chỉnh riêng từng người.
mau: _mau
macDinh:
  height: 1.6 # chiều cao hiển thị
  yOffset: 0 # nâng hoặc hạ chân
# Vũ khí hiển thị theo loại khi nhân vật chưa trang bị (GLB xuất từ mô hình Blender của S24).
vuKhiMacDinh:
  sword: kiem-sat-lu-khach
  great: dai-kiem-xom-mo
  spear: thuong-go-lim
  bow: cung-tre-dau-lang
  cat: vo-chep-thay-do
# Cách cầm vũ khí: xương VRM chuẩn hóa, độ lệch trong hệ bàn tay (m), góc xoay (độ), tỉ lệ, điểm cầm dọc thân vũ khí (at).
camVuKhi:
  sword: { bone: rightHand, pos: [-0.08, -0.012, 0.005], rot: [90, 0, 0], scale: 0.75, at: -0.17 }
  great: { bone: rightHand, pos: [-0.08, -0.012, 0.005], rot: [90, 0, 0], scale: 0.85, at: -0.12 }
  spear: { bone: rightHand, pos: [-0.08, -0.012, 0.005], rot: [90, 0, 0], scale: 0.9, at: -0.62 }
  bow: { bone: leftHand, pos: [0.08, -0.012, 0.005], rot: [90, 0, 0], scale: 0.85, at: 0 }
  cat: { bone: rightHand, pos: [-0.06, 0.14, 0.02], rot: [0, 0, 0], scale: 0.6, at: 0 }
# Clip hoạt ảnh theo loại vũ khí (tên clip trong public/media/anim/humanoid.json, xem tools/anim/recipes.ts).
hoatAnh:
  sword: { stand: swordIdle, atk: [sword1, sword2, sword3], charge: cast, skill: skill, burst: burst, speed: 1 }
  great: { stand: swordIdle, atk: [great1, great2, great3], charge: cast, skill: skill, burst: burst, speed: 0.75 }
  spear: { stand: idle, atk: [spear1, spear2, spear3], charge: cast, skill: skill, burst: burst, speed: 1 }
  bow:
    {
      stand: bowReady,
      ready: bowReady,
      move: { walk: bowWalk, run: bowRun, sprint: bowSprint },
      atk: [bow1, bow2, bow3],
      charge: bowAim,
      skill: skill,
      burst: bowBurst,
      speed: 1,
    }
  cat: { stand: idle, atk: [cat1, cat2, cat3], charge: cast, skill: skill, burst: burst, speed: 1 }
nhanVat:
  havy: { height: 1.55 }
