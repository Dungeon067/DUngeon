  turret: Triệu hồi linh vật đứng yên 10 giây, cứ mỗi giây bắn một tia nguyên tố gây {pct}% sát thương.
  heal: Gây {pct}% sát thương nguyên tố xung quanh và hồi 12% máu tối đa cho cả đội.
  vortex: Tạo xoáy phía trước 2.5 giây, hút kẻ địch vào giữa và gây {pct}% sát thương mỗi 0.5 giây. Rất hợp để Khuếch Tán.
  shield: Gây {pct}% sát thương Thổ xung quanh và tạo khiên bằng 30% máu tối đa trong 12 giây.
burstDesc:
  inferno: Sau một nhịp, nổ lớn bán kính rộng gây {pct}% sát thương nguyên tố.
  storm: Gọi 10 đòn sét/tên giáng xuống kẻ địch xung quanh, mỗi đòn {pct}% sát thương.
  tide: Sóng lớn gây {pct}% sát thương và hồi 30% máu cho cả đội, hồi sinh không được.
  meteor: Thiên thạch rơi vào kẻ địch gần nhất, gây {pct}% sát thương diện rộng và tạo khiên.
  blizzard: Tạo vùng bão theo sát bản thân trong 6 giây, mỗi 0.5 giây gây {pct}% sát thương.
