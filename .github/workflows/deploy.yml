name: Triển khai bản chơi thử

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: deploy-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Video ước nguyện S20 nằm trong Git LFS: chỉ kéo các file game dùng, cache theo mã file để đỡ tốn băng thông LFS.
      - name: Danh sách file video ước nguyện
        if: github.event.action != 'closed'
        run: git lfs ls-files -l -I "media/cinematic/out/audio/**,media/cinematic/out/video/**" | cut -d' ' -f1 > .lfs-cine
      - uses: actions/cache@v4
        if: github.event.action != 'closed'
        with:
          path: .git/lfs
          key: lfs-cine-${{ hashFiles('.lfs-cine') }}
          restore-keys: lfs-cine-
      # Bản xem thử PR chỉ có video 720p cho nhẹ gh-pages; bản main thêm 1080p WebM.
      - name: Kéo video ước nguyện (Git LFS)
        if: github.event.action != 'closed'
        run: git lfs pull -I "media/cinematic/out/audio/**,media/cinematic/out/video/*-720.*${{ github.event_name == 'push' && ',media/cinematic/out/video/*-1080.webm' || '' }}"
      - uses: pnpm/action-setup@v4
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: pnpm
      - name: Build
        if: github.event.action != 'closed'
        env:
          # Bản xem thử PR có thêm trang /styleguide/; bản main thì không.
          STYLEGUIDE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          touch dist/.nojekyll

      - name: Đăng bản main lên gh-pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/

      - name: Bản xem thử cho pull request
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
