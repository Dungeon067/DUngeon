[package]
name = "tinh-tu"
version = "0.1.0"
description = "Tinh Tú Ước Nguyện (bản máy tính)"
authors = ["Tinh Tú"]
license = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "tinh_tu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
