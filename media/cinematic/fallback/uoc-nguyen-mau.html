<style>
/* Layout: one full-screen canvas stage (the wish ritual) with a thin DOM control layer. Single deliberate night look: bronze drum altar, star gold for 5★, amethyst for 4★, sky blue for 3★. */
:root{
  --night:#04050c; --ink:#f3ecdb; --dim:#a9a7c2; --bronze:#c99a5b;
  --gold:#ffcf5a; --violet:#b98cff; --sky:#6fb6ff;
  --f-display:"Cormorant Garamond", Georgia, serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#ui{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;transition:opacity .35s, transform .35s}
#ui.off{opacity:0;transform:translateY(16px);pointer-events:none}
.info{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:52ch}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);font-weight:700}
.feat{font-family:var(--f-display);font-size:clamp(30px,4.4vw,52px);font-weight:700;line-height:1;color:var(--ink);text-shadow:0 2px 24px rgba(255,190,90,.25);text-wrap:balance}
.meta{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wish{position:relative;border:1px solid rgba(255,220,150,.35);background:linear-gradient(180deg,rgba(40,32,60,.85),rgba(20,16,36,.9));border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.15;min-width:150px;backdrop-filter:blur(6px)}
.wish small{font-weight:500;font-size:12px;color:var(--dim)}
.wish.main{background:linear-gradient(180deg,#ffe3a0,#e9b24c);color:#2a1a02;border-color:#ffe3a0;box-shadow:0 0 28px rgba(255,200,90,.35)}
.wish.main small{color:#5a3b06}
.wish:hover{filter:brightness(1.08)}
.tiny{background:rgba(20,18,40,.7);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--dim)}
.tiny:hover{color:var(--ink)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:8px}
#skip[hidden]{display:none}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);text-align:center;font-size:12px;color:rgba(243,236,219,.55);pointer-events:none;letter-spacing:.04em}
@media (max-width:640px){.wish{min-width:128px;padding:10px 16px}}
</style>

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const ease={out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.70158,d=c+1;return 1+d*Math.pow(t-1,3)+c*Math.pow(t-1,2);}};
function hash2(x,y,s=0){let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function hex(h){const c=h.replace("#","");return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function rgba(h,a){const [r,g,b]=hex(h);return `rgba(${r},${g},${b},${a})`;}
function mix(a,b,t){const A=hex(a),B=hex(b);return "#"+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,"0")).join("");}
function shade(h,amt){return amt<0?mix(h,"#000000",-amt):mix(h,"#ffffff",amt);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

 {id:"havy",name:"Hạ Vy",r:4,el:"ice",w:"bow",title:"Cung Thủ Sương Giá",line:"Mùa hè mà lạnh thế này, là tại tôi đó.",look:{hair:"#a8d8f0",style:"bob",outfit:"#3e5f8a",accent:"#e6f9ff",skin:"#f8dcc6",eye:"#8fe1ff",coat:false}},
];
const byId=Object.fromEntries(CHARS.map(c=>[c.id,c]));
const ITEMS3=[{n:"Kiếm Sắt Cũ",k:"sword"},{n:"Cung Tre",k:"bow"},{n:"Sách Phép Rách",k:"book"},{n:"Thương Gỗ",k:"spear"},{n:"Đại Kiếm Gỉ",k:"great"}];
const FEATURED="lachong";

/* ---- chibi renderer (ported from the game) ---- */
function drawBackHair(c,L){c.fillStyle=shade(L.hair,-.12);if(L.style==="long"){rr(c,-11.5,-36,23,27,8);c.fill();}else if(L.style==="pony"){c.beginPath();c.moveTo(-6,-34);c.quadraticCurveTo(-20,-30,-15,-14);c.quadraticCurveTo(-12,-20,-4,-26);c.closePath();c.fill();}else if(L.style==="bob"){rr(c,-12,-36,24,17,8);c.fill();}}
function drawWeapon(c,ch,L){const w=ch.w,acc=L.accent,el=EL[ch.el].c;
 if(w==="sword"){c.fillStyle="#e6edf5";rr(c,-1.3,-20,2.6,18,1);c.fill();c.fillStyle=el;c.fillRect(-.5,-18,1,14);c.fillStyle=acc;c.fillRect(-4,-2.5,8,2.2);c.fillStyle="#4a3524";c.fillRect(-1,-.5,2,4);}
 else if(w==="great"){c.fillStyle="#cfd6de";c.beginPath();c.moveTo(-3,-1);c.lineTo(-3.4,-24);c.lineTo(0,-29);c.lineTo(3.4,-24);c.lineTo(3,-1);c.closePath();c.fill();c.fillStyle=el;c.fillRect(-.9,-24,1.8,20);c.fillStyle=acc;c.fillRect(-6,-2,12,3);c.fillStyle="#4a3524";c.fillRect(-1.2,1,2.4,5);}
 else if(w==="spear"){c.fillStyle="#6b4a2e";c.fillRect(-.9,-30,1.8,40);c.fillStyle=acc;c.beginPath();c.moveTo(0,-38);c.lineTo(-3.2,-29);c.lineTo(3.2,-29);c.closePath();c.fill();c.fillStyle=el;c.fillRect(-2,-29,4,2);}
 else if(w==="bow"){c.strokeStyle=shade(acc,-.2);c.lineWidth=2.2;c.beginPath();c.arc(3,-4,11,-1.25,1.25);c.stroke();c.strokeStyle="rgba(255,255,255,.7)";c.lineWidth=.6;c.beginPath();c.moveTo(3+11*Math.cos(-1.25),-4+11*Math.sin(-1.25));c.lineTo(3+11*Math.cos(1.25),-4+11*Math.sin(1.25));c.stroke();}}
function drawCatalyst(c,ch,t){const el=EL[ch.el];const y=-34+Math.sin(t*3)*2;const g=c.createRadialGradient(13,y,0,13,y,9);g.addColorStop(0,rgba(el.c2,.95));g.addColorStop(1,rgba(el.c,0));c.fillStyle=g;c.beginPath();c.arc(13,y,9,0,TAU);c.fill();c.fillStyle=el.c2;c.save();c.translate(13,y);c.rotate(t*1.5);c.fillRect(-3,-3,6,6);c.restore();}
function drawChibi(c,ch,x,y,s,t=0){
 const L=ch.look;c.save();c.translate(x,y);c.scale(s,s);c.translate(0,-Math.sin(t*2.4)*.6);
 drawBackHair(c,L);
 if(L.coat){c.fillStyle=shade(L.outfit,-.2);c.beginPath();c.moveTo(-7,-17);c.lineTo(7,-17);c.lineTo(7+Math.sin(t*2)*1.2,-3);c.lineTo(-10+Math.sin(t*2+1)*1.2,-2);c.closePath();c.fill();}
 c.save();c.translate(-6,-17);c.rotate(.08);c.fillStyle=shade(L.outfit,-.15);rr(c,-1.8,0,3.6,9,1.8);c.fill();c.fillStyle=L.skin;c.beginPath();c.arc(0,9,1.8,0,TAU);c.fill();c.restore();
 const pants=shade(L.outfit,-.45);c.fillStyle=pants;rr(c,-5,-8,4,7.5,1.6);c.fill();rr(c,1,-8,4,7.5,1.6);c.fill();
 c.fillStyle="#3a2a22";rr(c,-5.5,-2.2,5,2.6,1.2);c.fill();rr(c,.5,-2.2,5,2.6,1.2);c.fill();
 c.fillStyle=L.outfit;rr(c,-7,-19.5,14,13,4.5);c.fill();c.beginPath();c.moveTo(-7.5,-11);c.lineTo(7.5,-11);c.lineTo(9,-5.5);c.lineTo(-9,-5.5);c.closePath();c.fill();
 c.fillStyle=L.accent;c.fillRect(-7.2,-11.2,14.4,1.8);c.beginPath();c.moveTo(-3.5,-19.5);c.lineTo(0,-15);c.lineTo(3.5,-19.5);c.closePath();c.fill();
 c.fillStyle=EL[ch.el].c;c.save();c.translate(4.2,-10.3);c.rotate(Math.PI/4);c.fillRect(-1.6,-1.6,3.2,3.2);c.restore();
 c.fillStyle=L.skin;c.beginPath();c.arc(0,-29,10.5,0,TAU);c.fill();
 c.fillStyle=L.hair;c.beginPath();c.arc(0,-30,11.2,Math.PI*1.02,Math.PI*1.98);c.lineTo(10.6,-27);c.lineTo(8,-29.5);c.lineTo(6,-25.5);c.lineTo(3.5,-29);c.lineTo(.5,-25);c.lineTo(-2.5,-29);c.lineTo(-5.5,-25.5);c.lineTo(-8.5,-29);c.lineTo(-10.8,-24);c.closePath();c.fill();
 c.beginPath();c.moveTo(-11,-30);c.quadraticCurveTo(-12.5,-23,-9.5,-19);c.lineTo(-8.5,-26);c.closePath();c.fill();
 if(L.style==="long"||L.style==="bob"){c.beginPath();c.moveTo(11,-30);c.quadraticCurveTo(12.5,-23,9.5,-18);c.lineTo(8.5,-26);c.closePath();c.fill();}
 c.fillStyle="#2a1e2e";c.beginPath();c.ellipse(1.6,-25.8,1.5,2.2,0,0,TAU);c.fill();c.beginPath();c.ellipse(6.6,-25.8,1.4,2.1,0,0,TAU);c.fill();
 c.fillStyle=L.eye;c.beginPath();c.ellipse(1.6,-25.2,1.1,1.3,0,0,TAU);c.fill();c.beginPath();c.ellipse(6.6,-25.2,1,1.2,0,0,TAU);c.fill();
 c.fillStyle="#fff";c.fillRect(1.6,-27,.9,.9);c.fillRect(6.6,-27,.8,.8);
 c.fillStyle="rgba(255,120,120,.35)";c.beginPath();c.ellipse(-1.5,-22.6,1.8,1,0,0,TAU);c.fill();c.beginPath();c.ellipse(8.6,-22.6,1.4,.9,0,0,TAU);c.fill();
 c.strokeStyle="#7a3b3b";c.lineWidth=.7;c.beginPath();c.arc(4.4,-22.4,1.1,.2,Math.PI-.2);c.stroke();
 c.fillStyle=L.hair;
 if(L.style==="spiky"){for(let i=0;i<5;i++){const a=Math.PI*1.1+i*.2;c.beginPath();c.moveTo(Math.cos(a)*8,-30+Math.sin(a)*8);c.lineTo(Math.cos(a+.1)*16,-30+Math.sin(a+.1)*16);c.lineTo(Math.cos(a+.25)*8,-30+Math.sin(a+.25)*8);c.closePath();c.fill();}}
 if(L.style==="buns"){c.beginPath();c.arc(-7.5,-39,4.2,0,TAU);c.arc(7.5,-39,4.2,0,TAU);c.fill();c.fillStyle=L.accent;c.fillRect(-9.5,-36.5,4,1.4);c.fillRect(5.5,-36.5,4,1.4);}
 if(L.style==="pony"){c.fillStyle=L.accent;c.beginPath();c.arc(-9,-33,1.8,0,TAU);c.fill();}
 c.fillStyle="rgba(255,255,255,.18)";c.beginPath();c.ellipse(-3,-37,4,1.6,-.3,0,TAU);c.fill();
 if(ch.w==="cat")drawCatalyst(c,ch,t);
 c.save();c.translate(6,-17);c.rotate(ch.w==="bow"?-1.3:-.35);c.fillStyle=shade(L.outfit,.05);rr(c,-1.8,0,3.6,9,1.8);c.fill();c.fillStyle=L.skin;c.beginPath();c.arc(0,9,1.9,0,TAU);c.fill();
 if(ch.w!=="cat"){c.translate(0,9.5);c.rotate(ch.w==="bow"?1.3:1.2);drawWeapon(c,ch,L);}c.restore();
 c.restore();
}
// Transparent character art with an elemental aura, cached per size.
const artCache={};
function charArt(id,h,raw){
 const key=id+"_"+h+(raw?"r":"");if(artCache[key])return artCache[key];
 const ch=byId[id],w=Math.round(h*.8),cv=document.createElement("canvas");cv.width=w;cv.height=h;const c=cv.getContext("2d");
 const el=EL[ch.el];if(!raw){const g=c.createRadialGradient(w/2,h*.46,0,w/2,h*.46,h*.5);g.addColorStop(0,rgba(el.c,.35));g.addColorStop(1,rgba(el.c,0));c.fillStyle=g;c.fillRect(0,0,w,h);}
 const s=h/50;drawChibi(c,ch,w/2,h*.93,s,.6);
 artCache[key]=cv;return cv;
}
const cardCache={};
function cardArt(id,w,h){
 const key=id+w+"x"+h;if(cardCache[key])return cardCache[key];
 const ch=byId[id],el=EL[ch.el],cv=document.createElement("canvas");cv.width=w;cv.height=h;const c=cv.getContext("2d");
 const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,shade(el.c,-.5));g.addColorStop(1,shade(el.c,-.85));c.fillStyle=g;c.fillRect(0,0,w,h);
 c.save();c.translate(w/2,h*.42);c.globalAlpha=.14;c.fillStyle=el.c2;for(let i=0;i<14;i++){c.rotate(TAU/14);c.beginPath();c.moveTo(0,0);c.lineTo(h,-h*.06);c.lineTo(h,h*.06);c.closePath();c.fill();}c.restore();
 drawChibi(c,ch,w/2,h*.8,h/62,.6);
 cardCache[key]=cv;return cv;
}

/* ============================ audio (synth, starts on a tap) ============================ */
let AC=null,master=null,soundOn=true;
function audio(){
 if(!soundOn)return null;
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);}catch(e){return null;}}
 if(AC.state==="suspended")AC.resume();return AC;
}
function tone(f,t0,dur,type,vol,f2){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+dur);g.gain.setValueAtTime(.0001,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol,a.currentTime+t0+Math.min(.04,dur/4));g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+dur);o.connect(g);g.connect(master);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+dur+.05);}

// Shot 2  "Lên trời"    follow the lantern through clouds; it bursts into the featured constellation

}

function onItem(){const it=S.order[S.idx];S.t=0;S.parts=[];S.rings=[];S.flash=it.r===5?.6:.35;S.flashCol=RC[it.r];S.starsShown=0;S.revealCue=false;}

function update(rdt){

 if(S.phase==="idle"){if(Math.random()<rdt*10)spark(rand(0,W),H+10,"#ffd68c",{a:-Math.PI/2+rand(-.3,.3),v:rand(20,60),drag:.2,life:rand(3,6),size:rand(1,2.2)});}
 else if(S.phase==="s1"){
  const k=S.t/SHOT.s1;
  if(S.t>1.0)cue("lantern",CIN.lantern);
  if(S.t>=SHOT.s1){go("s2");CIN.rise();}
 }

  const k=S.t/SHOT.s2;
  if(S.t>.9){const ln=Math.floor((S.t-.9)/.08);if(ln>=0&&ln<BIRD_EDGES.length)cue("l"+ln,()=>CIN.line(ln));}
  if(S.t>.85)cue("burst",()=>{CIN.burstStars();S.flash=.35;S.flashCol="#ffe1a0";for(let i=0;i<90;i++)spark(W/2,H*.55,i%2?"#ffd68c":"#ffffff",{v:rand(80,520),life:rand(.6,1.4)});});
  if(S.t>=SHOT.s2){go("s3");CIN.meteor();}
 }
 else if(S.phase==="s3"){

  X.font=`700 ${Math.max(11,Math.round(nameSize*.15))}px "Be Vietnam Pro",sans-serif`;X.fillStyle=col;X.fillText((it.isNew?"HỘ TINH MỚI":"ĐÃ GẶP LẠI · +1 CUNG MỆNH")+(it.feat?" · NHÂN VẬT GIỚI HẠN":""),tx,ty-nameSize*1.45);X.globalAlpha=1;
 }else{
  const enter=ease.out(clamp(S.t/.5,0,1));const s=Math.min(W,H)*.42;drawItemIcon(it.k,cx+(1-enter)*80,cy,s,col);
  X.textAlign="center";const tx=land?cx:W/2,ty=land?H*.86:H*.74;X.font=`700 ${Math.round(Math.min(W*.07,64))}px "Cormorant Garamond",Georgia,serif`;X.fillStyle="#f3ecdb";X.globalAlpha=enter;X.fillText(it.name,tx,ty);X.font=`600 14px "Be Vietnam Pro",sans-serif`;X.fillStyle=col;X.fillText("★★★ · đổi thành 500 Xu",tx,ty+30);X.globalAlpha=1;
 }
 drawParts();
 X.textAlign="center";X.font=`500 12px "Be Vietnam Pro",sans-serif`;X.fillStyle="rgba(243,236,219,.5)";X.fillText(`${S.idx+1}/${S.order.length} · chạm để tiếp tục`,W/2,H-18);
}
function drawSummary(t){
 X.fillStyle="#04050c";X.fillRect(0,0,W,H);for(const s of stars){X.globalAlpha=.3+.4*Math.abs(Math.sin(S.gt*.7*s.d+s.p));X.fillStyle="#e9ecff";X.fillRect(s.x*W,s.y*H,s.r,s.r);}X.globalAlpha=1;
 const items=[...S.list].sort((a,b)=>b.r-a.r),n=items.length,cols=n>5?5:n,rows=Math.ceil(n/cols);
 const gap=Math.max(6,W*.008),cw=Math.min((W-32)/cols-gap,200),ch=Math.min(cw*1.55,(H-130)/rows-gap),cwF=ch/1.55;
 const totalW=cols*(cwF+gap)-gap,ox=(W-totalW)/2,oy=(H-(rows*(ch+gap)-gap))/2+14;
 X.textAlign="center";X.font=`700 ${Math.round(Math.min(40,W*.05))}px "Cormorant Garamond",Georgia,serif`;X.fillStyle="#f3ecdb";X.fillText("Sao đã rơi",W/2,Math.max(40,oy-20));
 items.forEach((it,i)=>{const p=clamp((t-i*.07)/.35,0,1);if(p<=0)return;const x=ox+(i%cols)*(cwF+gap),y=oy+Math.floor(i/cols)*(ch+gap)+(1-ease.out(p))*30;const sx=Math.abs(Math.cos(Math.PI*(1-p)));const front=p>.5,col=RC[it.r];
  X.save();X.translate(x+cwF/2,y+ch/2);X.scale(Math.max(.02,sx),1);X.translate(-cwF/2,-ch/2);
  if(it.r===5&&front){X.globalCompositeOperation="lighter";blob(cwF/2,ch/2,cwF*1.1,col,.35+.15*Math.sin(S.gt*3));X.globalCompositeOperation="source-over";}
  rr(X,0,0,cwF,ch,10);X.save();X.clip();
  if(!front){X.fillStyle="#1a1630";X.fillRect(0,0,cwF,ch);X.strokeStyle="rgba(201,154,91,.5)";for(let k=1;k<5;k++){X.beginPath();X.arc(cwF/2,ch/2,cwF*.12*k,0,TAU);X.stroke();}}
  else if(it.kind==="char")X.drawImage(cardArt(it.id,200,310),0,0,cwF,ch);
  else{X.fillStyle="#1d2a44";X.fillRect(0,0,cwF,ch);drawItemIcon(it.k,cwF/2,ch*.42,cwF*.8,col);}
  if(front){const vg=X.createLinearGradient(0,ch*.55,0,ch);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.75)");X.fillStyle=vg;X.fillRect(0,0,cwF,ch);X.fillStyle="#fff";X.font=`700 ${Math.max(10,Math.round(cwF*.11))}px "Be Vietnam Pro",sans-serif`;X.textAlign="center";X.fillText(it.name,cwF/2,ch-cwF*.2);X.fillStyle=col;X.font=`${Math.max(10,Math.round(cwF*.12))}px sans-serif`;X.fillText("★".repeat(it.r),cwF/2,ch-cwF*.06);}
  X.restore();X.strokeStyle=front?col:"rgba(201,154,91,.6)";X.lineWidth=2;rr(X,0,0,cwF,ch,10);X.stroke();X.restore();});
 drawParts();
}
function drawIdle(t){
 cam={x:640+Math.sin(t*.1)*20,y:500,z:1.08};X.save();applyCam();drawSet(t,{arm:0,drumGlow:.12+.06*Math.sin(t*2)});X.restore();
 // the featured constellation faintly in the sky
 X.save();X.globalCompositeOperation="lighter";const R=Math.min(W,H)*.22,cx=W*.62,cy=H*.24;X.strokeStyle="rgba(255,214,140,.35)";X.lineWidth=1.2;for(const [a,b] of BIRD_EDGES){X.beginPath();X.moveTo(cx+BIRD[a][0]*R,cy+BIRD[a][1]*R);X.lineTo(cx+BIRD[b][0]*R,cy+BIRD[b][1]*R);X.stroke();}BIRD.forEach((p,i)=>blob(cx+p[0]*R,cy+p[1]*R,5+2*Math.sin(t*2+i),"#ffd68c",.8));X.restore();
 // featured portrait floating over the sea
 const h=Math.round(Math.min(H*.62,W*.42)),art=charArt(FEATURED,h);X.globalAlpha=.95;X.drawImage(art,W*.7-art.width/2,H*.47-h*.5+Math.sin(t*1.2)*6);X.globalAlpha=1;
 drawParts();
}
function render(t){
 X.setTransform(DPR,0,0,DPR,0,0);
 const sh=S.shake?[rand(-S.shake,S.shake),rand(-S.shake,S.shake)]:[0,0];X.save();X.translate(sh[0],sh[1]);
 if(S.phase==="idle")drawIdle(t);else if(S.phase==="s1")shot1(t);else if(S.phase==="s2")shot2(t);else if(S.phase==="s3")shot3(t);else if(S.phase==="s4")shot4(t);else if(S.phase==="reveal")drawReveal(t);else if(S.phase==="summary")drawSummary(S.t);
 X.restore();
 if(S.flash>0){X.fillStyle=rgba(S.flashCol,Math.min(1,S.flash)*.85);X.fillRect(0,0,W,H);}
 // cinematic letterbox and a brief dip between shots
 if(S.bars>0){const bh=H*.1*ease.out(S.bars);X.fillStyle="#000";X.fillRect(0,0,W,bh);X.fillRect(0,H-bh,W,bh);}
 if(["s1","s2","s3","s4"].includes(S.phase)&&S.t<.12){X.fillStyle=`rgba(0,0,0,${1-S.t/.12})`;X.fillRect(0,0,W,H);}
}

/* ============================ loop & input ============================ */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);render(now/1000);}catch(e){console.error(e);}requestAnimationFrame(frame);}
const ui=document.getElementById("ui"),skipBtn=document.getElementById("skip"),hint=document.getElementById("hint");
function updPity(){document.getElementById("pity").innerHTML=`Bảo hiểm 5★: <b>${pity.p5}</b>/90 · 4★: <b>${pity.p4}</b>/10${pity.guaranteed?" · <b>Lần 5★ tới chắc chắn là Lạc Hồng</b>":""}`;}
document.getElementById("w1").addEventListener("click",()=>{audio();pull(1);});
document.getElementById("w10").addEventListener("click",()=>{audio();pull(10);});
document.getElementById("demo5").addEventListener("click",()=>{audio();force5=true;pull(1);});
skipBtn.addEventListener("click",e=>{e.stopPropagation();skip();});
const sndBtn=document.getElementById("snd");
sndBtn.addEventListener("click",e=>{e.stopPropagation();soundOn=!soundOn;sndBtn.textContent="Âm thanh: "+(soundOn?"bật":"tắt");sndBtn.setAttribute("aria-pressed",soundOn);if(!soundOn&&AC)AC.suspend();else audio();});
cv.addEventListener("pointerdown",()=>{if(S.phase==="reveal"){if(S.t<2){S.t=2.2;S.starsShown=S.order[S.idx].r;if(!S.revealCue){S.revealCue=true;}}else nextItem();}else if(S.phase==="summary"){if(S.t>.6)finish();}});
addEventListener("keydown",e=>{if(e.key==="Escape")skip();if((e.key===" "||e.key==="Enter")&&(S.phase==="reveal"||S.phase==="summary")){e.preventDefault();cv.dispatchEvent(new PointerEvent("pointerdown"));}});
function boot(data){if(data&&data.pity)Object.assign(pity,data.pity);resize();updPity();requestAnimationFrame(frame);
 if(document.fonts)document.fonts.ready.then(()=>{for(const k in artCache)delete artCache[k];for(const k in cardCache)delete cardCache[k];for(const k in silCache)delete silCache[k];});}
window.claude?.hot?.snapshot?.(()=>({pity}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

</script>
